<style>

  input,select,button{padding:7px 10px;font-size:14px;margin:2px}
  button{cursor:pointer}
  table{border-collapse:collapse;width:100%;margin:6px 0}
  th,td{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left;font-size:14px}
  .card{border:1px solid #ccc;border-radius:8px;padding:12px;margin:10px 0;max-width:1100px}
  .err{color:#b00020}.chip{display:inline-block;background:#eef;border-radius:10px;padding:1px 8px;margin:1px;font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dot{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-2px}
  #wrap{overflow:auto;border:1px solid #ccc;border-radius:8px;max-height:80vh}
  #map{position:relative;width:1400px;height:1000px}
  .county-svg{position:absolute;filter:drop-shadow(0 4px 4px rgba(0,0,0,.1));transition:transform .2s}
  .county-svg:hover{transform:scale(1.03);cursor:pointer}
  #tooltip{position:absolute;background:#333;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:1000;font-size:13px;line-height:1.45;max-width:320px;pointer-events:none}
  .office{display:block;border:1px solid #ddd;border-radius:8px;padding:8px;margin:6px 0}
  .office.off{opacity:.45}
</style>

/* ---------- indulás ---------- */
async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { S.user = null; return renderLogin(); }
  S.user = session.user;
  const { data } = await sb.from('profiles').select('username,is_admin').eq('id', S.user.id).single();
  S.profile = data || {};
  const [o, b, d] = await Promise.all([
    sb.from('offices').select('*').order('sort'),
    sb.from('building_types').select('key,name'),
    sb.from('county_definitions').select('name,start_office')]);
  S.offices = o.data || [];
  S.btypes = Object.fromEntries((b.data || []).map(x => [x.key, x.name]));
  S.defs = d.data || [];
  await loadGames();
  S.sel ? await openGame(S.sel) : renderList();
}
const safeBoot = () => boot().catch(e => { renderLogin(); $('lmsg').textContent = 'A Supabase nem érhető el ebben a környezetben (' + e.message + '). Próbáld a Demó módot.'; });
if (sb) sb.auth.onAuthStateChange(ev => { if (['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev)) safeBoot(); });
else setTimeout(renderLogin, 0);

async function loadGames() {
  const { data } = await sb.from('games').select('*').order('created_at', {ascending:false});
  S.games = data || [];
  const m = await sb.from('game_players').select('game_id,office').eq('profile_id', S.user.id);
  S.mySeats = Object.fromEntries((m.data || []).map(x => [x.game_id, x.office]));
}

/* ---------- belépés ---------- */
function renderLogin() {
  $('app').innerHTML = `<div class="card" style="max-width:340px"><h2>Pályi-játék</h2>
    <input id="un" placeholder="Felhasználónév" autocomplete="off"><br>
    <input id="pw" type="text" autocomplete="off" placeholder="Jelszó" style="-webkit-text-security:disc;text-security:disc">
    <button onclick="const s=$('pw').style;s.webkitTextSecurity=s.webkitTextSecurity==='none'?'disc':'none'" title="Jelszó mutatása">👁</button><br>
    <button onclick="login(false)">Belépés</button> <button onclick="login(true)">Regisztráció</button>
    <button onclick="demoStart()">Demó mód</button>
    <p id="lmsg" class="err"></p></div>`;
  $('pw').onkeydown = e => e.key === 'Enter' && login(false);
}
async function login(reg) {
  const m = $('lmsg'); m.textContent = '';
  try {
    if (!sb) { m.textContent = 'A Supabase nem érhető el ebben a környezetben. Próbáld a Demó módot.'; return; }
    const u = $('un').value.trim(), password = $('pw').value;
    if (!u || password.length < 6) { m.textContent = 'Adj meg felhasználónevet és legalább 6 karakteres jelszót.'; return; }
    const email = toEmail(u);
    m.textContent = reg ? 'Regisztráció…' : 'Belépés…';
    const r = reg ? await sb.auth.signUp({ email, password, options:{ data:{ username:u } } })
                  : await sb.auth.signInWithPassword({ email, password });
    if (r.error) m.textContent = r.error.message;
    else if (reg && !r.data.session) m.textContent = 'Regisztrálva. Most lépj be.';
  } catch (e) { m.textContent = 'Hálózati hiba: ' + e.message; }
}
const logout = () => { S.sel = null; if (S.demo) { S.demo = false; S.games = []; return renderLogin(); } sb.auth.signOut(); };
const bar = () => `<p><b>${esc(S.profile.username)}</b> ${S.profile.is_admin ? '<span class="chip">admin</span>' : ''}${S.demo ? '<span class="chip">DEMÓ – helyi adatok, nincs mentés</span>' : ''}
  <button onclick="logout()">Kilépés</button></p>`;

"Pest-Pilis-Solt-Kiskun": "nagyur", "Budapest": "nagyur", "Nógrád": "nagyur", "Hont": "nagyur", "Somogy": "penzugy", "Belovár-Kőrós": "penzugy", "Zala": "penzugy", "Szatmár": "hadugy", "Szilágy": "hadugy", "Szabolcs": "hadugy", "Trencsén": "igazsag", "Nyitra": "igazsag", "Pozsony": "igazsag", "Gömör-és-Kis-Hont": "belugy", "Abaúj-Torna": "belugy", "Zemplén": "belugy", "Alsó-Fehér": "gazdasagi", "Kis-Küküllő": "gazdasagi", "Nagy-Küküllő": "gazdasagi"}, "offices": [{"key": "nagyur", "name": "Nagyúr", "color": "#c0392b", "duty": "Vezeti a közös célokat, elősegíti a belső egységet.", "ability": "Rendeletet adhat ki, amit mindenki betartani köteles; a Változás akciónál 5 mozgást végezhet."}, {"key": "penzugy", "name": "Pénzügyminiszter", "color": "#27ae60", "duty": "Fenntartja a kereskedelmet és az árstabilitást.", "ability": "Felső és alsó határt szabhat a kereskedelmi árakra; egyszer vétózhat egy akciót."}, {"key": "hadugy", "name": "Hadügyminiszter", "color": "#2c3e50", "duty": "Külső támadás esetén haditervet dolgoz ki, irányítja a hadműveleteket.", "ability": "Kötelező hadi fejlesztéseket rendelhet el; +1 szénért 3 egységet állíthat ki."}, {"key": "igazsag", "name": "Igazságügy-miniszter", "color": "#8e44ad", "duty": "A bírósági kérdésekben dönt.", "ability": "+1 fáért +1 munkaerőt helyezhet fel a munkaerő akciónál."}, {"key": "belugy", "name": "Belügyminiszter", "color": "#e67e22", "duty": "Belső konfliktusok békés megoldása.", "ability": "Egyszer vétózhatja a Nagyúr rendeletét; +1 téglával 3 dolgot építhet egyszerre."}, {"key": "gazdasagi", "name": "Gazdasági biztos", "color": "#16a085", "duty": "A gazdasági stabilitást biztosítja.", "ability": "Termeléskor +1-et ad a dobáshoz, de 1 vagy 6 esetén nem termel."}]};
function demoStart() {
  S.demo = true; S.user = { id:'demo' }; S.profile = { username:'admin (demó)', is_admin:true };
  S.offices = DEMO.offices; S.btypes = {}; S.mySeats = {};
  S.defs = Object.entries(DEMO.start).map(([name, start_office]) => ({ name, start_office }));
  S.games = [{ id:'demo', name:'Demó játék', status:'lobby', speed_multiplier:1 }];
  S.players = DEMO.offices.map(o => ({ id:'p_' + o.key, office:o.key, nation_name:o.name, color:o.color, profile_id:null, profiles:null }));
  S.counties = Object.keys(POS).map(n => { const d = DEMO.counties[n] || { r:[], f:[] };
    return { id:'c_' + n, owner_id:DEMO.start[n] ? 'p_' + DEMO.start[n] : null, buildings:[],
      county_definitions:{ name:n, features:d.f, county_resources:d.r.map(resource => ({ resource })) } }; });
  S.byName = Object.fromEntries(S.counties.map(x => [x.county_definitions.name, x]));
  renderList();
}

/* ---------- játéklista (admin + játékos) ---------- */
function renderList() {
  S.sel = null; S.joinGame = null;
  if (S.ch) { sb.removeChannel(S.ch); S.ch = null; }
  const adm = S.profile.is_admin;
  let h = bar();
  if (adm) h += `<div class="card"><h2>Új játék indítása</h2><div class="row">
    <input id="gn" placeholder="Játék neve">
    <label>Sebesség ×<input id="gs" type="number" step="0.5" min="0.5" value="1" style="width:70px"></label>
    <label>Győzelmi pont<input id="gv" type="number" placeholder="opc." style="width:80px"></label>
    <label><input id="gt" type="checkbox" checked> Teszt: mind a 6 tisztség betöltése</label>
    <button onclick="createGame()">Létrehozás</button></div></div>`;
  h += `<div class="card"><h2>Játékok</h2><table><tr><th>Név</th><th>Állapot</th><th>Sebesség</th><th></th></tr>` +
    (S.games.filter(g => adm || g.status !== 'finished' || S.mySeats[g.id]).map(g => `<tr><td>${esc(g.name)}</td><td>${ST[g.status]}</td><td>×${g.speed_multiplier}</td><td>` +
      (adm || S.mySeats[g.id] ? `<button onclick="openGame('${g.id}')">Megnyitás${S.mySeats[g.id] ? ' (' + esc(S.offices.find(o => o.key === S.mySeats[g.id])?.name) + ')' : ''}</button>`
        : g.status !== 'finished' ? `<button onclick="startJoin('${g.id}')">Csatlakozás</button>` : '') + `</td></tr>`).join('')
      || '<tr><td colspan="4">Még nincs játék.</td></tr>') + `</table>${S.msg ? `<p class="err">${esc(S.msg)}</p>` : ''}</div>`;
  $('app').innerHTML = h;
}
async function createGame() {
  if (S.demo) return openGame('demo');
  const name = $('gn').value.trim(); if (!name) { S.msg = 'Adj nevet a játéknak'; return renderList(); }
  const test = $('gt').checked;
  const { data, error } = await sb.rpc('admin_create_game', { p_name:name, p_speed:Number($('gs').value) || 1, p_victory_points:$('gv').value ? Number($('gv').value) : null });
  if (error) { S.msg = error.message; return renderList(); }
  if (test) { const r = await sb.rpc('admin_seed_offices', { p_game:data }); if (r.error) S.msg = r.error.message; }
  await loadGames(); await openGame(data);
}

/* ---------- csatlakozás: tisztség választás ---------- */
async function startJoin(id) {
  S.joinGame = id; S.msg = '';
  S.taken = (await sb.rpc('taken_offices', { p_game:id })).data || [];
  $('app').innerHTML = bar() + `<div class="card"><h2>Válassz tisztséget</h2>` + S.offices.map(o => {
    const t = S.taken.includes(o.key), cs = S.defs.filter(d => d.start_office === o.key).map(d => d.name).join(', ');
    return `<label class="office ${t ? 'off' : ''}"><input type="radio" name="off" value="${o.key}" ${t ? 'disabled' : ''}>
      <span class="dot" style="background:${o.color}"></span><b>${esc(o.name)}</b>${t ? ' (foglalt)' : ''}<br>
      <small>${esc(o.duty)} <i>${esc(o.ability)}</i><br>Kezdő vármegyék: ${esc(cs)}</small></label>`; }).join('') +
    `<button onclick="doJoin()">Csatlakozom</button> <button onclick="renderList()">Mégse</button><p id="jmsg" class="err"></p></div>`;
}
async function doJoin() {
  const key = document.querySelector('input[name=off]:checked')?.value;
  if (!key) { $('jmsg').textContent = 'Válassz egy tisztséget.'; return; }
  const { error } = await sb.rpc('join_game', { p_game:S.joinGame, p_office:key });
  if (error) { $('jmsg').textContent = error.message; return; }
  await loadGames(); await openGame(S.joinGame);
}

/* ---------- játék nézet + térkép ---------- */
async function loadState() {
  if (S.demo) return;
  const [p, c] = await Promise.all([
    sb.from('game_players').select('id,office,nation_name,color,profile_id,profiles(username)').eq('game_id', S.sel),
    sb.from('counties').select('id,owner_id,county_definitions(name,features,county_resources(resource)),buildings(building_type,level,status)').eq('game_id', S.sel)]);
  S.msg = p.error?.message || c.error?.message || '';
  S.players = p.data || []; S.counties = c.data || [];
  S.byName = Object.fromEntries(S.counties.map(x => [x.county_definitions.name, x]));
}
async function openGame(id) {
  S.sel = id; await loadState(); renderGame();
  if (S.demo) return;
  if (S.ch) sb.removeChannel(S.ch);
  S.ch = sb.channel('g' + id).on('postgres_changes', { event:'*', schema:'public', table:'counties', filter:'game_id=eq.' + id },
    async () => { await loadState(); renderGame(); }).subscribe();
}
const rpc = async (fn, args) => {
  if (S.demo) {
    if (fn === 'admin_set_game_status') S.games[0].status = args.p_status;
    if (fn === 'admin_assign_county') { const c = S.counties.find(x => x.id === args.p_county); if (c) c.owner_id = args.p_player; }
    S.msg = ''; return renderGame();
  }
  const { error } = await sb.rpc(fn, args); S.msg = error ? error.message : ''; await loadGames(); await loadState(); renderGame(); };
const setStatus = s => rpc('admin_set_game_status', { p_game:S.sel, p_status:s });
const seedTest = () => rpc('admin_seed_offices', { p_game:S.sel });
const assign = (cid, pid) => rpc('admin_assign_county', { p_county:cid, p_player:pid || null });
async function delGame() {
  if (S.demo) { S.sel = null; return renderList(); }
  if (!confirm('Biztosan törlöd a játékot? Ez végleges.')) return;
  const { error } = await sb.from('games').delete().eq('id', S.sel);
  S.msg = error?.message || ''; await loadGames(); renderList();
}

function renderGame() {
  const g = S.games.find(x => x.id === S.sel); if (!g) return renderList();
  const adm = S.profile.is_admin, cnt = id => S.counties.filter(c => c.owner_id === id).length;
  const keep = $('pick')?.innerHTML || '';
  let h = bar() + `<div class="card"><div class="row"><button onclick="renderList()">← Játékok</button>
    <h2 style="margin:0">${esc(g.name)}</h2><span class="chip">${ST[g.status]}</span>` +
    (adm ? `<button onclick="setStatus('running')" ${g.status === 'running' ? 'disabled' : ''}>▶ Indítás</button>
    <button onclick="setStatus('paused')" ${g.status !== 'running' ? 'disabled' : ''}>⏸ Szünet</button>
    <button onclick="setStatus('finished')" ${g.status === 'finished' ? 'disabled' : ''}>■ Lezárás</button>
    <button onclick="seedTest()">Teszt tisztségek</button>
    <button onclick="delGame()" style="color:#b00020">Törlés</button>` : '') + `</div>
    ${S.msg ? `<p class="err">${esc(S.msg)}</p>` : ''}
    <div class="row" style="margin-top:8px">` + (S.players.map(p => `<span class="chip" style="background:${esc(p.color)}22">
      <span class="dot" style="background:${esc(p.color)}"></span>${esc(p.nation_name)} – ${p.profiles?.username ? esc(p.profiles.username) : '<i>teszt</i>'} – ${cnt(p.id)} megye</span>`).join('')
      || 'Még nincs játékos.') + `</div>
    <div id="pick" style="margin-top:8px;font-size:14px">${keep || 'Kattints egy vármegyére a részletekért.'}</div></div>
    <div id="wrap"><div id="map"></div></div>`;
  $('app').innerHTML = h; buildMap();
}
function buildMap() {
  els = {};
  Object.keys(POS).forEach(n => {
    const box = document.createElement('div');
    box.className = 'county-svg'; box.style.left = POS[n].left; box.style.top = POS[n].top;
    box.onmouseenter = e => tip(n, e); box.onmousemove = moveTip;
    box.onmouseleave = () => $('tooltip').style.display = 'none';
    box.onclick = e => { pick(n); tip(n, e); };
    $('map').appendChild(box); els[n] = box;
    (svgCache[n] ??= fetch('svg/' + n + '.svg').then(r => r.text()).catch(() => '')).then(t => {
      box.appendChild(t ? new DOMParser().parseFromString(t, 'image/svg+xml').querySelector('svg')
        : new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="18" fill="#d3d3d3"><rect width="26" height="18" rx="4" stroke="#fff"/></svg>', 'image/svg+xml').querySelector('svg'));
      paint(n);
    });
  });
}
function paint(n) {
  const c = S.byName[n], p = c && S.players.find(x => x.id === c.owner_id);
  els[n]?.querySelector('svg')?.setAttribute('fill', p ? p.color : '#d3d3d3');
}
function info(n) {
  const c = S.byName[n]; if (!c) return `<b>${esc(n)}</b> (nincs az adatbázisban)`;
  const d = c.county_definitions, p = S.players.find(x => x.id === c.owner_id);
  const b = c.buildings.map(x => (S.btypes[x.building_type] || x.building_type) + ' ' + x.level + '. szint' + (x.status === 'constructing' ? ' (épül)' : '')).join(', ') || 'nincs';
  return `<b>${esc(n)}</b><br>Tulajdonos: ${p ? esc(p.nation_name) + (p.profiles?.username ? ' (' + esc(p.profiles.username) + ')' : ' (teszt ülés)') : 'senkié'}<br>
    Termel: ${d.county_resources.map(r => RES[r.resource]).join(', ') || '–'}<br>Egyéb: ${esc(d.features.join(', ')) || '–'}<br>Épületek: ${esc(b)}`;
}
function tip(n, e) { const t = $('tooltip'); t.innerHTML = info(n); t.style.display = 'block'; moveTip(e); }
function moveTip(e) { const t = $('tooltip'); t.style.left = e.pageX + 12 + 'px'; t.style.top = e.pageY + 12 + 'px'; }
function pick(n) {
  const c = S.byName[n]; let h = info(n);
  if (S.profile.is_admin && c) h += `<br>Tulajdonos módosítása: <select onchange="assign('${c.id}', this.value)"><option value="">– senkié –</option>` +
    S.players.map(p => `<option value="${p.id}" ${p.id === c.owner_id ? 'selected' : ''}>${esc(p.nation_name)}</option>`).join('') + `</select>`;
  $('pick').innerHTML = h;
}
</script>
</body>
</html>
