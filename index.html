<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png" type="image/png">
<title>Pályi-játék</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#f3ede0;--ink:#2a2119;--card:#fffdf8;--line:#e0d4bd;--accent:#7a1f1f;--gold:#b8892b;--muted:#7a6c5a;--ok:#2e7d4f;--warn:#b26a00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Arial,sans-serif}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:.2em 0}
  input,select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  input{color:#2a2119;-webkit-text-fill-color:#2a2119;caret-color:#2a2119;background:#fff}
  .mask{-webkit-text-security:disc;text-security:disc}
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  button{cursor:pointer}button:hover:not(:disabled){filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}
  .btn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);font-weight:400}
  .btn.danger{color:#b00020;background:#fff}
  header{background:var(--accent);color:#f6e7c1;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  header .brand{font:700 20px Georgia,serif;margin-right:auto}
  header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
  main{max-width:1180px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#efe6d2;border-radius:999px;padding:2px 10px;font-size:13px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:3px}
  .err{color:#b00020}.okm{color:var(--ok)}
  .badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:#8a8070}
  .badge.running{background:var(--ok)}.badge.paused{background:var(--warn)}.badge.finished{background:#444}
  /* belépés */
  .auth{display:grid;grid-template-columns:1.1fr 1fr;gap:0;max-width:960px;margin:6vh auto;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .hero{background:linear-gradient(160deg,#5c1414,#8c2a2a);color:#f6e7c1;padding:34px}
  .hero h1{font-size:34px;margin:0 0 6px}.hero p{opacity:.92}
  .hero .offs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:18px;font-size:13px}
  .form{background:var(--card);padding:30px}
  .tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
  .field input{width:100%}.pwrow{display:flex;gap:6px}.pwrow input{flex:1}
  .hint{font-size:12px;min-height:16px;margin-top:2px}
  @media(max-width:760px){.auth{grid-template-columns:1fr;margin:0}.hero{padding:22px}}
  /* játékok */
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .game{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .offgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .office{border:2px solid var(--line);border-left-width:10px;border-radius:10px;padding:10px;background:#fff;cursor:pointer}
  .office.sel{border-color:var(--accent);background:#fbf1e3}.office.off{opacity:.45;cursor:not-allowed}
  /* térkép */
  #wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#e9e1cf;height:72vh}
  #map{position:relative;width:1400px;height:1000px;transform-origin:0 0}
  .county-svg{position:absolute;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12));transition:transform .15s}
  .county-svg:hover{transform:scale(1.04);cursor:pointer;z-index:5}
  #tooltip{position:absolute;background:#2a2119;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:1000;font-size:13px;line-height:1.45;max-width:320px;pointer-events:none}
  .zoom{position:sticky;float:right;top:8px;right:8px;margin:8px;z-index:20;display:flex;gap:4px}
  .zoom button{padding:4px 10px}
  /* piac modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;padding:12px;overflow-y:auto}
  .modal{background:var(--card);border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px 20px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 4px;padding-right:30px}
  .modal .close{position:absolute;top:10px;right:10px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
  .modal-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0 14px;flex-wrap:wrap}
  .modal-tabs button{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:0;cursor:pointer}
  .modal-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .mitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}
  .mitem .row{margin:4px 0;flex-wrap:wrap}
  @media(max-width:600px){.modal-backdrop{align-items:flex-start;padding:8px}.modal{padding:14px;max-height:calc(100vh - 16px)}.modal-tabs button{padding:8px 10px;font-size:14px}}
</style>
</head>

/* ---------- indulás ---------- */
async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { S.user = null; return renderAuth(); }
  S.user = session.user;
  const { data } = await sb.from('profiles').select('username,is_admin').eq('id', S.user.id).single();
  S.profile = data || {};
  const [o, b, d, r] = await Promise.all([
    sb.from('offices').select('*').order('sort'),
    sb.from('building_types').select('*'),
    sb.from('county_definitions').select('id,name,features,start_office'),
    sb.from('county_resources').select('definition_id,resource')]);
  S.offices = o.data || [];
  S.btypes = Object.fromEntries((b.data || []).map(x => [x.key, x.name]));
  S.btAll = b.data || [];
  S.defs = d.data || [];
  S.cres = {}; (r.data || []).forEach(x => (S.cres[x.definition_id] ??= []).push({ resource:x.resource }));
  S.msg = o.error?.message || d.error?.message || r.error?.message || '';
  await loadGames();
  S.sel ? await openGame(S.sel) : renderList();
}

async function loadGames() {
  const { data } = await sb.from('games').select('*').order('created_at', {ascending:false});
  S.games = data || [];
  const m = await sb.from('game_players').select('game_id,office').eq('profile_id', S.user.id);
  S.mySeats = Object.fromEntries((m.data || []).map(x => [x.game_id, x.office]));
}

  const adm = S.profile.is_admin;
  el.innerHTML = `<div class="row">` +
    (adm ? `Megfigyelt játékos: <select onchange="setActAs(this.value)">${S.players.map(p => `<option value="${p.id}" ${p.id === S.actAs ? 'selected' : ''}>${esc(p.nation_name)}</option>`).join('')}</select>` : '') +
    Object.keys(RES).map(k => `<span class="chip" style="${S.res[k] > 0 ? '' : 'opacity:.5'}">${RES[k]}: <b>${num(S.res[k] || 0)}</b></span>`).join('') +
    `<span class="chip">👥 munkaerő: <b id="mpv">–</b></span></div>
    <div class="row" style="margin-top:6px"><button class="btn" onclick="rpc('collect_all',{p_player:S.actAs})">Összes begyűjtése (<span id="pend">0</span> db)</button>` +
    `<button class="btn" onclick="openMarket()">🏪 Piac</button>` +
    (adm ? `<button class="btn ghost" onclick="rpc('admin_grant',{p_player:S.actAs,p_amount:50})">+50 mindenből (teszt)</button>` : '') + `</div>`;
}

function renderPick() {
  const el = $('pick'); if (!el) return;
  const n = S.picked;
  if (!n) { el.innerHTML = '<span style="color:var(--muted)">Kattints egy vármegyére a részletekért.</span>'; return; }
  const c = S.byName[n]; let h = info(n);
  if (!c) { el.innerHTML = h; return; }
  const adm = S.profile.is_admin, mine = c.owner_id && (adm || c.owner_id === S.actAs);
  if (adm) h += `<br>Tulajdonos módosítása: <select onchange="assign('${c.id}', this.value)"><option value="">– senkié –</option>` +
    S.players.map(p => `<option value="${p.id}" ${p.id === c.owner_id ? 'selected' : ''}>${esc(p.nation_name)}</option>`).join('') + `</select>`;
  if (!S.demo && mine) {
    const g = S.games.find(x => x.id === S.sel), rows = S.prod.filter(r => r.county_id === c.id);
    h += `<hr><b>Termelés</b>: ` + (rows.map(r => `${RES[r.resource]} <b data-lv="${c.id}|${r.resource}">0</b>/${num(r.cap_amount)} <small>(+${num(r.rate_per_hour)}/ó)</small>`).join(' · ')
      || '<i>csak futó játékban termel</i>') + ` <button class="btn ghost" onclick="rpc('collect_county',{p_county:'${c.id}'})">Begyűjtés</button>`;
    const have = new Set(c.buildings.map(b => b.building_type));
    h += `<hr><b>Építkezés</b>` + (g.status !== 'running' ? `<div class="err">A játék nem fut – indítsd el (▶ Indítás).</div>` : '');
    c.buildings.filter(b => new Date(b.completes_at) > Date.now()).forEach(b => {
      h += `<div>${esc(S.btypes[b.building_type])}: épül, még <b data-end="${b.completes_at}"></b></div>`; });
    h += S.btAll.filter(b => !have.has(b.key)).map(b => {
      const ok = c.owner_id !== S.actAs || (Object.entries(b.cost || {}).every(([k, v]) => (S.res[k] || 0) >= v) && curMp() >= b.manpower_cost);
      return `<div class="row" style="margin:6px 0"><span class="grow"><b>${esc(b.name)}</b> – ${effectHtml(b)}<br><small>Ár: ${costHtml(b.cost)}${b.manpower_cost ? ', ' + b.manpower_cost + ' munkaerő' : ''} · idő: ${fmtT(b.build_seconds / (g.speed_multiplier || 1))}</small></span>
        <button class="btn" ${ok && g.status === 'running' ? '' : 'disabled'} onclick="rpc('build_building',{p_county:'${c.id}',p_type:'${b.key}'})">Építés</button></div>`; }).join('');
  }
  el.innerHTML = h; tick();
}

function tick() {
  document.querySelectorAll('[data-lv]').forEach(e => { const [cid, res] = e.dataset.lv.split('|');
    const r = S.prod.find(x => x.county_id === cid && x.resource === res); if (r) e.textContent = num(liveAmt(r)); });
  const mp = $('mpv'); if (mp) mp.textContent = Math.floor(curMp());
  const pd = $('pend'); if (pd) pd.textContent = Math.floor(S.prod.filter(r => r.owner_id === S.actAs).reduce((a, r) => a + liveAmt(r), 0));
  document.querySelectorAll('[data-end]').forEach(e => { const s = (Date.parse(e.dataset.end) - Date.now()) / 1000; e.textContent = fmtT(s);
    if (s <= 0 && !S.fin[e.dataset.end]) { S.fin[e.dataset.end] = 1; setTimeout(refreshNow, 800); } });
}

/* ---------- piac (modal) ---------- */
async function openMarket() {
  if (S.demo) { alert('A piac demó módban nem elérhető.'); return; }
  if (!S.actAs) return;
  if ($('market-backdrop')) return;
  document.body.insertAdjacentHTML('beforeend',
    `<div class="modal-backdrop" id="market-backdrop" onclick="if(event.target===this)closeMarket()">
      <div class="modal">
        <button class="close" onclick="closeMarket()">✕</button>
        <h2>🏪 Piac</h2>
        <div id="market-content">Betöltés…</div>
      </div>
    </div>`);
  S.marketTab = 'browse';
  await loadMarketAndRender();
}
function closeMarket() { $('market-backdrop')?.remove(); }
async function loadMarket() {
  if (S.demo || !S.actAs || !S.sel) return;
  const [l, o] = await Promise.all([
    sb.from('market_listings').select('*').eq('game_id', S.sel).order('created_at', { ascending:false }),
    sb.from('market_offers').select('*').eq('game_id', S.sel).order('created_at', { ascending:false })
  ]);
  if (l.error) S.msg = l.error.message;
  if (o.error) S.msg = o.error.message;
  S.marketListings = l.data || [];
  S.marketOffers = o.data || [];
}
async function loadMarketAndRender() { await loadMarket(); renderMarket(); }
async function marketTab(t) { S.marketTab = t; await loadMarketAndRender(); }
const resName = r => RES[r] || r;
const listingTitle = l => l.kind === 'sell'
  ? `Kínál: ${l.amount}× ${resName(l.resource)}`
  : `Keres: ${l.amount}× ${resName(l.resource)}`;
function playerName(pid) { const p = S.players.find(x => x.id === pid); return p ? esc(p.nation_name) : '(?)'; }

function renderMarket() {
  const el = $('market-content'); if (!el) return;
  const tab = S.marketTab || 'browse', me = S.actAs;
  let h = `<div class="modal-tabs">
    <button class="${tab==='browse'?'on':''}" onclick="marketTab('browse')">Hirdetések</button>
    <button class="${tab==='mine'?'on':''}" onclick="marketTab('mine')">Saját hirdetéseim</button>
    <button class="${tab==='offers'?'on':''}" onclick="marketTab('offers')">Ajánlataim</button>
    <button class="${tab==='new'?'on':''}" onclick="marketTab('new')">➕ Új</button>
  </div>`;
  if (tab === 'browse') h += renderMarketBrowse(me);
  else if (tab === 'mine') h += renderMarketMine(me);
  else if (tab === 'offers') h += renderMarketOffers(me);
  else h += renderMarketNew();
  el.innerHTML = h;
}

function renderMarketBrowse(me) {
  const others = (S.marketListings || []).filter(l => l.status === 'open' && l.author_id !== me);
  if (!others.length) return '<p style="color:var(--muted)">Nincs más nyitott hirdetés.</p>';
  return others.map(l => {
    const my = (S.marketOffers || []).find(o => o.listing_id === l.id && o.bidder_id === me && o.status === 'pending');
    return `<div class="mitem">
      <div class="row"><b class="grow">${listingTitle(l)}</b><small>${playerName(l.author_id)}</small></div>
      <div style="color:var(--muted);font-size:12px;margin:4px 0">${new Date(l.created_at).toLocaleString('hu-HU')}</div>
      ${my
        ? `<div class="chip" style="background:#e8f5e9">Ajánlatod: ${my.give_amount}× ${resName(my.give_resource)} ↔ ${my.get_amount}× ${resName(my.get_resource)} (függő)</div>`
        : `<button class="btn ghost" onclick="marketOfferForm('${l.id}')">Ajánlat tétel</button>
           <div id="offer-form-${l.id}" style="display:none;margin-top:8px">
             <div class="row">
               <label style="font-size:13px">${l.kind === 'sell' ? 'Te adod:' : 'Te kapod:'}
                 <select id="of-res-${l.id}">${Object.keys(RES).filter(k => k !== l.resource).map(k => `<option value="${k}">${RES[k]}</option>`).join('')}</select>
               </label>
               <input id="of-amt-${l.id}" type="number" min="1" value="1" style="width:90px">
               <button class="btn" onclick="marketSubmitOffer('${l.id}')">Küldés</button>
             </div>
             <div style="font-size:12px;color:var(--muted);margin-top:4px">
               ${l.kind === 'sell'
                 ? `Te adod a fenti nyersanyagot letétbe. Ő adja neked: ${l.amount}× ${resName(l.resource)}.`
                 : `Te adod neki: ${l.amount}× ${resName(l.resource)} (letétbe). Te kapod a fenti nyersanyagot.`}
             </div>
           </div>`}
    </div>`;
  }).join('');
}
function marketOfferForm(lid) {
  const el = $('offer-form-' + lid);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
async function marketSubmitOffer(lid) {
  const res = $('of-res-' + lid)?.value, amt = Number($('of-amt-' + lid)?.value);
  if (!amt || amt < 1) return alert('Adj meg érvényes mennyiséget.');
  const { error } = await sb.rpc('market_offer', { p_listing: lid, p_player: S.actAs, p_resource: res, p_amount: amt });
  if (error) return alert(error.message);
  await loadMarketAndRender(); await refreshNow();
}

function renderMarketMine(me) {
  const mine = (S.marketListings || []).filter(l => l.author_id === me);
  if (!mine.length) return '<p style="color:var(--muted)">Még nincs hirdetésed.</p>';
  return mine.map(l => {
    const pending = (S.marketOffers || []).filter(o => o.listing_id === l.id && o.status === 'pending');
    const badge = { open: '🟢 nyitott', done: '✅ kész', cancelled: '⚪ visszavonva' }[l.status] || l.status;
    let h = `<div class="mitem">
      <div class="row"><b class="grow">${listingTitle(l)}</b><span class="chip">${badge}</span></div>
      <div style="color:var(--muted);font-size:12px">${new Date(l.created_at).toLocaleString('hu-HU')}</div>`;
    if (l.status === 'open') {
      h += `<div class="row" style="margin-top:6px"><button class="btn danger" onclick="marketCancel('${l.id}')">Hirdetés visszavonása</button></div>`;
    }
    if (pending.length) {
      h += `<div style="margin-top:10px"><b>Beérkezett ajánlatok:</b></div>`;
      h += pending.map(o => `<div class="row" style="margin:6px 0;padding:8px;background:#f8f4e8;border-radius:6px">
        <span class="grow">${playerName(o.bidder_id)}: ad <b>${o.give_amount}× ${resName(o.give_resource)}</b>, kap <b>${o.get_amount}× ${resName(o.get_resource)}</b></span>
        <button class="btn" onclick="marketDecide('${o.id}', true)">Elfogad</button>
        <button class="btn ghost" onclick="marketDecide('${o.id}', false)">Elutasít</button>
      </div>`).join('');
    } else if (l.status === 'open') {
      h += `<div style="color:var(--muted);font-size:13px;margin-top:6px">Nincs függő ajánlat.</div>`;
    }
    return h + '</div>';
  }).join('');
}

function renderMarketOffers(me) {
  const mine = (S.marketOffers || []).filter(o => o.bidder_id === me);
  if (!mine.length) return '<p style="color:var(--muted)">Még nincs ajánlatod.</p>';
  return mine.map(o => {
    const l = (S.marketListings || []).find(x => x.id === o.listing_id);
    const st = { pending: '⏳ függő', accepted: '✅ elfogadva', declined: '❌ elutasítva', withdrawn: '⚪ visszavonva' }[o.status] || o.status;
    return `<div class="mitem">
      <div class="row"><b class="grow">${l ? listingTitle(l) : '(törölt hirdetés)'}</b><span class="chip">${st}</span></div>
      <div style="font-size:13px">Adok: <b>${o.give_amount}× ${resName(o.give_resource)}</b> · Kapok: <b>${o.get_amount}× ${resName(o.get_resource)}</b></div>
      ${o.status === 'pending' ? `<div class="row" style="margin-top:6px"><button class="btn ghost" onclick="marketWithdraw('${o.id}')">Visszavonás</button></div>` : ''}
    </div>`;
  }).join('');
}

function renderMarketNew() {
  return `<div class="mitem">
    <label style="display:block;margin-bottom:8px">Hirdetés típusa<br><select id="nl-kind" style="width:100%;max-width:420px">
      <option value="sell">Kínálok (én adok, mások ajánlanak érte)</option>
      <option value="buy">Keresek (én kapok, mások szállítanak)</option>
    </select></label>
    <div class="row">
      <label>Nyersanyag <select id="nl-res">${Object.keys(RES).map(k => `<option value="${k}">${RES[k]}</option>`).join('')}</select></label>
      <label>Mennyiség <input id="nl-amt" type="number" min="1" value="1" style="width:100px"></label>
      <button class="btn" onclick="marketSubmitCreate()">Hirdetés létrehozása</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin:10px 0 0">
      <b>Kínálok</b>: az áru azonnal letétbe kerül, csak elfogadáskor kapod meg az ellenértéket.<br>
      <b>Keresek</b>: a hirdető fizet elfogadáskor; az ajánlattevő áruja letétbe kerül.
    </p>
  </div>`;
}
async function marketSubmitCreate() {
  const kind = $('nl-kind')?.value, res = $('nl-res')?.value, amt = Number($('nl-amt')?.value);
  if (!amt || amt < 1) return alert('Adj meg érvényes mennyiséget.');
  const { error } = await sb.rpc('market_post', { p_player: S.actAs, p_kind: kind, p_resource: res, p_amount: amt });
  if (error) return alert(error.message);
  S.marketTab = 'mine';
  await loadMarketAndRender(); await refreshNow();
}
async function marketCancel(lid) {
  if (!confirm('Biztosan visszavonod ezt a hirdetést?')) return;
  const { error } = await sb.rpc('market_cancel', { p_listing: lid });
  if (error) return alert(error.message);
  await loadMarketAndRender(); await refreshNow();
}
async function marketWithdraw(oid) {
  if (!confirm('Biztosan visszavonod ezt az ajánlatot?')) return;
  const { error } = await sb.rpc('market_withdraw', { p_offer: oid });
  if (error) return alert(error.message);
  await loadMarketAndRender(); await refreshNow();
}
async function marketDecide(oid, accept) {
  if (!confirm(accept ? 'Elfogadod ezt az ajánlatot?' : 'Elutasítod ezt az ajánlatot?')) return;
  const { error } = await sb.rpc('market_decide', { p_offer: oid, p_accept: accept });
  if (error) return alert(error.message);
  await loadMarketAndRender(); await refreshNow();
}

setInterval(tick, 1000);
</script>
</body>
</html>
