<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png" type="image/png">
<title>Pályi-játék</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#f3ede0;--ink:#2a2119;--card:#fffdf8;--line:#e0d4bd;--accent:#7a1f1f;--gold:#b8892b;--muted:#7a6c5a;--ok:#2e7d4f;--warn:#b26a00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Arial,sans-serif}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:.2em 0}
  input,select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  input{color:#2a2119;-webkit-text-fill-color:#2a2119;caret-color:#2a2119;background:#fff}
  .mask{-webkit-text-security:disc;text-security:disc}
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  button{cursor:pointer}button:hover:not(:disabled){filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}
  .btn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);font-weight:400}
  .btn.danger{color:#b00020;background:#fff}
  header{background:var(--accent);color:#f6e7c1;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  header .brand{font:700 20px Georgia,serif;margin-right:auto}
  header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
  main{max-width:1180px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#efe6d2;border-radius:999px;padding:2px 10px;font-size:13px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:3px}
  .err{color:#b00020}.okm{color:var(--ok)}
  .badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:#8a8070}
  .badge.running{background:var(--ok)}.badge.paused{background:var(--warn)}.badge.finished{background:#444}
  /* belépés */
  .auth{display:grid;grid-template-columns:1.1fr 1fr;gap:0;max-width:960px;margin:6vh auto;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .hero{background:linear-gradient(160deg,#5c1414,#8c2a2a);color:#f6e7c1;padding:34px}
  .hero h1{font-size:34px;margin:0 0 6px}.hero p{opacity:.92}
  .hero .offs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:18px;font-size:13px}
  .form{background:var(--card);padding:30px}
  .tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
  .field input{width:100%}.pwrow{display:flex;gap:6px}.pwrow input{flex:1}
  .hint{font-size:12px;min-height:16px;margin-top:2px}
  @media(max-width:760px){.auth{grid-template-columns:1fr;margin:0}.hero{padding:22px}}
  /* játékok */
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .game{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .offgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .office{border:2px solid var(--line);border-left-width:10px;border-radius:10px;padding:10px;background:#fff;cursor:pointer}
  .office.sel{border-color:var(--accent);background:#fbf1e3}.office.off{opacity:.45;cursor:not-allowed}
  /* térkép */
  #wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#e9e1cf;height:72vh}
  #map{position:relative;width:1400px;height:1000px;transform-origin:0 0}
  .county-svg{position:absolute;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12));transition:transform .15s}
  .county-svg:hover{transform:scale(1.04);cursor:pointer;z-index:5}
  #tooltip{position:absolute;background:#2a2119;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:1000;font-size:13px;line-height:1.45;max-width:320px;pointer-events:none}
  .zoom{position:sticky;float:right;top:8px;right:8px;margin:8px;z-index:20;display:flex;gap:4px}
  .zoom button{padding:4px 10px}
</style>
</head>

  m = String(m || '');

  if (/database error saving/i.test(m)) return 'Ez a felhasználónév foglalt vagy nem megengedett.';
  if (/at least|weak/i.test(m)) return 'A jelszó legalább 6 karakter legyen.';
  if (/signups? (are )?(not allowed|disabled)/i.test(m)) return 'A regisztráció le van tiltva a Supabase beállításaiban.';
  if (/email not confirmed/i.test(m)) return 'A Supabase-ben be van kapcsolva az e-mail megerősítés – kapcsold ki (Authentication → Providers → Email).';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Túl sok próbálkozás, várj egy percet.';
  if (/failed to fetch|network/i.test(m)) return 'Nincs kapcsolat a szerverrel.';
  return m;
}

    <div class="offs">${offs.map(o => `<span><span class="dot" style="background:${o.color}"></span> ${esc(o.name)}</span>`).join('')}</div></div>
    <div class="form"><div class="tabs"><button class="${reg ? '' : 'on'}" onclick="setMode('login')">Belépés</button><button class="${reg ? 'on' : ''}" onclick="setMode('register')">Regisztráció</button></div>
    <label class="field"><span>Felhasználónév</span><input id="un" autocomplete="off" maxlength="24" oninput="checkName()"></label><div id="nhint" class="hint"></div>
    <label class="field"><span>Jelszó (min. 6 karakter)</span><div class="pwrow"><input id="pw" type="text" autocomplete="off" >
      <button class="btn ghost eye" type="button" onclick="togglePw()" title="Jelszó takarása / mutatása">🙈 Takar</button></div></label>
    ${reg ? `<label class="field"><span>Jelszó újra</span><input id="pw2" type="text" autocomplete="off" ></label>` : ''}
    <button id="go" class="btn" style="width:100%;margin-top:6px" onclick="submitAuth()">${reg ? 'Fiók létrehozása' : 'Belépés'}</button>
    <p id="amsg" class="hint"></p>
    <p style="text-align:center;margin:8px 0 0"><a href="#" onclick="demoStart();return false">Kipróbálom bejelentkezés nélkül (demó)</a></p></div></div>`;
  ['un','pw','pw2'].forEach(id => $(id) && ($(id).onkeydown = e => e.key === 'Enter' && submitAuth()));
}
function setMode(m) { authMode = m; renderAuth(true); }
function togglePw() {
  const on = !$('pw').classList.contains('mask');
  ['pw','pw2','np','np2'].forEach(id => $(id)?.classList.toggle('mask', on));
  document.querySelectorAll('.eye').forEach(x => x.textContent = on ? '👁 Mutat' : '🙈 Takar');
}
function checkName() {
  const h = $('nhint'); if (!h || authMode !== 'register') return;
  clearTimeout(nameTimer); const u = $('un').value.trim();
  if (!u) { h.textContent = ''; return; }
  if (!NAME_RE.test(u)) { h.className = 'hint err'; h.textContent = '3–24 karakter: betűk, számok, _ . -'; return; }
  if (!sb) return;
  nameTimer = setTimeout(async () => {
    const { data, error } = await sb.rpc('username_available', { p_name:u });
    if ($('un')?.value.trim() !== u || error) return;
    h.className = 'hint ' + (data ? 'okm' : 'err'); h.textContent = data ? '✓ szabad' : '✗ foglalt';
  }, 350);
}
async function submitAuth() {
  const reg = authMode === 'register', u = $('un').value.trim(), pw = $('pw').value;
  if (!sb) return setMsg('A Supabase nem érhető el ebben a környezetben. Próbáld a demót.');
  if (!u || !pw) return setMsg('Add meg a felhasználónevet és a jelszót.');
  if (reg && !NAME_RE.test(u)) return setMsg('A felhasználónév 3–24 karakter: betűk, számok, _ . -');
  if (pw.length < 6) return setMsg('A jelszó legalább 6 karakter legyen.');
  if (reg && pw !== $('pw2').value) return setMsg('A két jelszó nem egyezik.');
  const btn = $('go'); btn.disabled = true; setMsg(reg ? 'Regisztráció…' : 'Belépés…', false);
  try {
    const email = toEmail(u);
    if (reg) {
      const r = await sb.auth.signUp({ email, password:pw, options:{ data:{ username:u } } });
      if (r.error) throw r.error;
      if (!r.data.session) { const l = await sb.auth.signInWithPassword({ email, password:pw }); if (l.error) throw l.error; }
    } else {
      const r = await sb.auth.signInWithPassword({ email, password:pw }); if (r.error) throw r.error;
    }
  } catch (e) { setMsg(huErr(e.message)); btn.disabled = false; }
}
const logout = () => { S.sel = null; if (S.demo) { S.demo = false; S.games = []; return renderAuth(); } sb.auth.signOut(); };

/* ---------- fiók: jelszócsere ---------- */
function renderAccount() {
  $('app').innerHTML = header() + `<main><div class="card" style="max-width:420px"><h2>Jelszó módosítása</h2>
    <label class="field"><span>Új jelszó</span><input id="np" type="text" autocomplete="off" style="width:100%"></label>
    <label class="field"><span>Új jelszó újra</span><input id="np2" type="text" autocomplete="off" style="width:100%"></label>
    <div class="row"><button class="btn" onclick="changePw()">Mentés</button><button class="btn ghost" onclick="renderList()">Vissza</button></div><p id="amsg" class="hint"></p></div></main>`;
}
async function changePw() {
  const a = $('np').value, b = $('np2').value;
  if (a.length < 6) return setMsg('A jelszó legalább 6 karakter legyen.');
  if (a !== b) return setMsg('A két jelszó nem egyezik.');
  const { error } = await sb.auth.updateUser({ password:a });
  error ? setMsg(huErr(error.message)) : setMsg('A jelszó módosítva.', false);
}
const header = () => `<header><span class="brand">⚜ Pályi-játék</span>${S.demo ? '<span class="chip" style="color:var(--ink)">DEMÓ – nincs mentés</span>' : ''}
  <span>${esc(S.profile.username)}</span>${S.profile.is_admin ? '<span class="chip" style="color:var(--ink)">admin</span>' : ''}
  ${S.demo ? '' : '<button onclick="renderAccount()">Jelszó</button>'}<button onclick="logout()">Kilépés</button></header>`;

/* ---------- demó mód ---------- */
function demoStart() {
  S.demo = true; S.user = { id:'demo' }; S.profile = { username:'admin (demó)', is_admin:true };
  S.offices = DEMO.offices; S.btypes = {}; S.mySeats = {};
  S.defs = Object.entries(DEMO.start).map(([name, start_office]) => ({ name, start_office }));
  S.games = [{ id:'demo', name:'Demó játék', status:'lobby', speed_multiplier:1 }];
  S.players = DEMO.offices.map(o => ({ id:'p_' + o.key, office:o.key, nation_name:o.name, color:o.color, profile_id:null, profiles:null }));
  S.counties = Object.keys(POS).map(n => { const d = DEMO.counties[n] || { r:[], f:[] };
    return { id:'c_' + n, owner_id:DEMO.start[n] ? 'p_' + DEMO.start[n] : null, buildings:[],
      county_definitions:{ name:n, features:d.f, county_resources:d.r.map(resource => ({ resource })) } }; });
  S.byName = Object.fromEntries(S.counties.map(x => [x.county_definitions.name, x]));
  renderList();
}

/* ---------- játéklista ---------- */
function renderList() {
  S.sel = null; S.joinGame = null;
  if (S.ch) { sb.removeChannel(S.ch); S.ch = null; }
  const adm = S.profile.is_admin;
  let h = header() + '<main>';
  if (adm) h += `<div class="card"><h2>Új játék indítása</h2><div class="row">
    <input id="gn" class="grow" placeholder="Játék neve" style="min-width:180px">
    <label>Sebesség ×<input id="gs" type="number" step="0.5" min="0.5" value="1" style="width:76px"></label>
    <label>Győzelmi pont<input id="gv" type="number" placeholder="opc." style="width:90px"></label>
    <label class="chip"><input id="gt" type="checkbox" checked> Teszt: mind a 6 tisztség betöltése</label>
    <button class="btn" onclick="createGame()">Létrehozás</button></div></div>`;
  const list = S.games.filter(g => adm || g.status !== 'finished' || S.mySeats[g.id]);
  h += `<h2>Játékok</h2>${S.msg ? `<p class="err">${esc(S.msg)}</p>` : ''}<div class="games">` + (list.map(g => {
    const mine = S.mySeats[g.id], oname = S.offices.find(o => o.key === mine)?.name;
    return `<div class="game"><div class="row"><b class="grow">${esc(g.name)}</b><span class="badge ${g.status}">${ST[g.status]}</span></div>
      <div style="color:var(--muted);margin:4px 0 8px">Sebesség ×${g.speed_multiplier}${mine ? ' · tisztséged: ' + esc(oname) : ''}</div>` +
      (adm || mine ? `<button class="btn" onclick="openGame('${g.id}')">Megnyitás</button>`
        : g.status !== 'finished' ? `<button class="btn" onclick="startJoin('${g.id}')">Csatlakozás</button>` : '') + `</div>`; }).join('')
    || '<p>Még nincs játék.</p>') + '</div></main>';
  $('app').innerHTML = h;
}
async function createGame() {
  if (S.demo) return openGame('demo');
  const name = $('gn').value.trim(); if (!name) { S.msg = 'Adj nevet a játéknak'; return renderList(); }
  const test = $('gt').checked;
  const { data, error } = await sb.rpc('admin_create_game', { p_name:name, p_speed:Number($('gs').value) || 1, p_victory_points:$('gv').value ? Number($('gv').value) : null });
  if (error) { S.msg = error.message; return renderList(); }
  if (test) { const r = await sb.rpc('admin_seed_offices', { p_game:data }); if (r.error) S.msg = r.error.message; }
  await loadGames(); await openGame(data);
}

/* ---------- csatlakozás ---------- */
async function startJoin(id) {
  S.joinGame = id; S.pickOffice = null;
  S.taken = (await sb.rpc('taken_offices', { p_game:id })).data || [];
  $('app').innerHTML = header() + `<main><h2>Válassz tisztséget</h2><div class="offgrid">` + S.offices.map(o => {
    const t = S.taken.includes(o.key), cs = S.defs.filter(d => d.start_office === o.key).map(d => d.name).join(', ');
    return `<div class="office ${t ? 'off' : ''}" id="of_${o.key}" style="border-left-color:${o.color}" ${t ? '' : `onclick="selOffice('${o.key}')"`}>
      <b>${esc(o.name)}</b>${t ? ' <span class="chip">foglalt</span>' : ''}<br><small>${esc(o.duty)}<br><i>${esc(o.ability)}</i><br>Kezdő vármegyék: ${esc(cs)}</small></div>`; }).join('') +
    `</div><div class="row" style="margin-top:12px"><button class="btn" onclick="doJoin()">Csatlakozom</button><button class="btn ghost" onclick="renderList()">Mégse</button></div><p id="jmsg" class="err"></p></main>`;
}
function selOffice(k) { S.pickOffice = k; document.querySelectorAll('.office').forEach(e => e.classList.toggle('sel', e.id === 'of_' + k)); }
async function doJoin() {
  if (!S.pickOffice) { $('jmsg').textContent = 'Válassz egy tisztséget.'; return; }
  const { error } = await sb.rpc('join_game', { p_game:S.joinGame, p_office:S.pickOffice });
  if (error) { $('jmsg').textContent = error.message; return; }
  await loadGames(); await openGame(S.joinGame);
}

/* ---------- játék nézet + térkép ---------- */
async function loadState() {
  if (S.demo) return;
  const [p, c] = await Promise.all([
    sb.from('game_players').select('id,office,nation_name,color,profile_id,profiles(username)').eq('game_id', S.sel),
    sb.from('counties').select('id,owner_id,county_definitions(name,features,county_resources(resource)),buildings(building_type,level,status)').eq('game_id', S.sel)]);
  S.msg = p.error?.message || c.error?.message || '';
  S.players = p.data || []; S.counties = c.data || [];
  S.byName = Object.fromEntries(S.counties.map(x => [x.county_definitions.name, x]));
}
async function openGame(id) {
  S.sel = id; Z = null; await loadState(); renderGame();
  if (S.demo) return;
  if (S.ch) sb.removeChannel(S.ch);
  S.ch = sb.channel('g' + id).on('postgres_changes', { event:'*', schema:'public', table:'counties', filter:'game_id=eq.' + id },
    async () => { await loadState(); renderGame(); }).subscribe();
}
const rpc = async (fn, args) => {
  if (S.demo) {
    if (fn === 'admin_set_game_status') S.games[0].status = args.p_status;
    if (fn === 'admin_assign_county') { const c = S.counties.find(x => x.id === args.p_county); if (c) c.owner_id = args.p_player; }
    S.msg = ''; return renderGame();
  }
  const { error } = await sb.rpc(fn, args); S.msg = error ? error.message : ''; await loadGames(); await loadState(); renderGame(); };
const setStatus = s => rpc('admin_set_game_status', { p_game:S.sel, p_status:s });
const seedTest = () => rpc('admin_seed_offices', { p_game:S.sel });
const assign = (cid, pid) => rpc('admin_assign_county', { p_county:cid, p_player:pid || null });
async function delGame() {
  if (S.demo) { S.sel = null; return renderList(); }
  if (!confirm('Biztosan törlöd a játékot? Ez végleges.')) return;
  const { error } = await sb.from('games').delete().eq('id', S.sel);
  S.msg = error?.message || ''; await loadGames(); renderList();
}
function renderGame() {
  const g = S.games.find(x => x.id === S.sel); if (!g) return renderList();
  const adm = S.profile.is_admin, cnt = id => S.counties.filter(c => c.owner_id === id).length;
  const keep = $('pick')?.innerHTML || '';
  $('app').innerHTML = header() + `<main><div class="card"><div class="row"><button class="btn ghost" onclick="renderList()">← Játékok</button>
    <h2 style="margin:0">${esc(g.name)}</h2><span class="badge ${g.status}">${ST[g.status]}</span><span class="grow"></span>` +
    (adm ? `<button class="btn" onclick="setStatus('running')" ${g.status === 'running' ? 'disabled' : ''}>▶ Indítás</button>
    <button class="btn ghost" onclick="setStatus('paused')" ${g.status !== 'running' ? 'disabled' : ''}>⏸ Szünet</button>
    <button class="btn ghost" onclick="setStatus('finished')" ${g.status === 'finished' ? 'disabled' : ''}>■ Lezárás</button>
    <button class="btn ghost" onclick="seedTest()">Teszt tisztségek</button>
    <button class="btn danger" onclick="delGame()">Törlés</button>` : '') + `</div>
    ${S.msg ? `<p class="err">${esc(S.msg)}</p>` : ''}
    <div class="row" style="margin-top:10px">` + (S.players.map(p => `<span class="chip" style="background:${esc(p.color)}26"><span class="dot" style="background:${esc(p.color)}"></span>
      ${esc(p.nation_name)} · ${p.profiles?.username ? esc(p.profiles.username) : '<i>teszt</i>'} · ${cnt(p.id)} megye</span>`).join('') || 'Még nincs játékos.') + `</div>
    <div id="pick" style="margin-top:10px">${keep || '<span style="color:var(--muted)">Kattints egy vármegyére a részletekért.</span>'}</div></div>
    <div id="wrap"><div class="zoom"><button class="btn ghost" onclick="setZoom(Z-.15)">−</button><button class="btn ghost" onclick="setZoom(null)">⤢</button><button class="btn ghost" onclick="setZoom(Z+.15)">+</button></div>
    <div id="msz"><div id="map"></div></div></div></main>`;
  buildMap(); setZoom(Z);
}
function setZoom(z) {
  if (z === null || z === undefined) z = Math.max(.3, Math.min(1, ($('wrap').clientWidth - 6) / 1400));
  Z = Math.max(.3, Math.min(1.5, z));
  $('map').style.transform = `scale(${Z})`; $('msz').style.width = 1400 * Z + 'px'; $('msz').style.height = 1000 * Z + 'px';
}
function buildMap() {
  els = {};
  Object.keys(POS).forEach(n => {
    const box = document.createElement('div');
    box.className = 'county-svg'; box.style.left = POS[n].left; box.style.top = POS[n].top;
    box.onmouseenter = e => tip(n, e); box.onmousemove = moveTip;
    box.onmouseleave = () => $('tooltip').style.display = 'none';
    box.onclick = e => { pick(n); tip(n, e); };
    $('map').appendChild(box); els[n] = box;
    (svgCache[n] ??= fetch('svg/' + n + '.svg').then(r => r.ok ? r.text() : '').catch(() => '')).then(t => {
      box.appendChild(t ? new DOMParser().parseFromString(t, 'image/svg+xml').querySelector('svg')
        : new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="18" fill="#d3d3d3"><rect width="26" height="18" rx="4" stroke="#fff"/></svg>', 'image/svg+xml').querySelector('svg'));
      paint(n);
    });
  });
}
function paint(n) {
  const c = S.byName[n], p = c && S.players.find(x => x.id === c.owner_id);
  els[n]?.querySelector('svg')?.setAttribute('fill', p ? p.color : '#d3d3d3');
}
function info(n) {
  const c = S.byName[n]; if (!c) return `<b>${esc(n)}</b> (nincs az adatbázisban)`;
  const d = c.county_definitions, p = S.players.find(x => x.id === c.owner_id);
  const b = c.buildings.map(x => (S.btypes[x.building_type] || x.building_type) + ' ' + x.level + '. szint' + (x.status === 'constructing' ? ' (épül)' : '')).join(', ') || 'nincs';
  return `<b style="font:700 17px Georgia,serif">${esc(n)}</b><br>Tulajdonos: ${p ? esc(p.nation_name) + (p.profiles?.username ? ' (' + esc(p.profiles.username) + ')' : ' (teszt ülés)') : 'senkié'}<br>
    Termel: ${d.county_resources.map(r => RES[r.resource]).join(', ') || '–'}<br>Egyéb: ${esc(d.features.join(', ')) || '–'}<br>Épületek: ${esc(b)}`;
}
function tip(n, e) { const t = $('tooltip'); t.innerHTML = info(n); t.style.display = 'block'; moveTip(e); }
function moveTip(e) { const t = $('tooltip'); t.style.left = e.pageX + 12 + 'px'; t.style.top = e.pageY + 12 + 'px'; }
function pick(n) {
  const c = S.byName[n]; let h = info(n);
  if (S.profile.is_admin && c) h += `<br>Tulajdonos módosítása: <select onchange="assign('${c.id}', this.value)"><option value="">– senkié –</option>` +
    S.players.map(p => `<option value="${p.id}" ${p.id === c.owner_id ? 'selected' : ''}>${esc(p.nation_name)}</option>`).join('') + `</select>`;
  $('pick').innerHTML = h;
}
</script>
</body>
</html>
