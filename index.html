<html lang="hu">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pályi-játék</title>

<style>
  :root{--bg:#f3ede0;--ink:#2a2119;--card:#fffdf8;--line:#e0d4bd;--accent:#7a1f1f;--gold:#b8892b;--muted:#7a6c5a;--ok:#2e7d4f;--warn:#b26a00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Arial,sans-serif}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:.2em 0}
  input,select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  input{color:#2a2119;-webkit-text-fill-color:#2a2119;caret-color:#2a2119;background:#fff}
  .mask{-webkit-text-security:disc;text-security:disc}
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  button{cursor:pointer}button:hover:not(:disabled){filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}
  .btn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);font-weight:400}
  .btn.danger{color:#b00020;background:#fff}
  header{background:var(--accent);color:#f6e7c1;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  header .brand{font:700 20px Georgia,serif;margin-right:auto}
  header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
  main{max-width:1180px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#efe6d2;border-radius:999px;padding:2px 10px;font-size:13px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:3px}
  .err{color:#b00020}.okm{color:var(--ok)}
  .badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:#8a8070}
  .badge.running{background:var(--ok)}.badge.paused{background:var(--warn)}.badge.finished{background:#444}
  .auth{display:grid;grid-template-columns:1.1fr 1fr;gap:0;max-width:960px;margin:6vh auto;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .hero{background:linear-gradient(160deg,#5c1414,#8c2a2a);color:#f6e7c1;padding:34px}
  .hero h1{font-size:34px;margin:0 0 6px}.hero p{opacity:.92}
  .hero .offs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:18px;font-size:13px}
  .form{background:var(--card);padding:30px}
  .tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
  .field input{width:100%}.pwrow{display:flex;gap:6px}.pwrow input{flex:1}
  .hint{font-size:12px;min-height:16px;margin-top:2px}
  @media(max-width:760px){.auth{grid-template-columns:1fr;margin:0}.hero{padding:22px}}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .game{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .offgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .office{border:2px solid var(--line);border-left-width:10px;border-radius:10px;padding:10px;background:#fff;cursor:pointer}
  .office.sel{border-color:var(--accent);background:#fbf1e3}.office.off{opacity:.45;cursor:not-allowed}
  #wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#e9e1cf;height:58vh}
  #map{position:relative;width:1400px;height:1000px;transform-origin:0 0}
  .county-svg{position:absolute;cursor:pointer}
  #tooltip{position:absolute;background:#2a2119;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:1000;font-size:13px;line-height:1.45;max-width:320px;pointer-events:none}
  .zoom{position:sticky;float:right;top:8px;right:8px;margin:8px;z-index:20;display:flex;gap:4px}
  .zoom button{padding:4px 10px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;padding:12px;overflow-y:auto}
  .modal{background:var(--card);border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px 20px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 4px;padding-right:30px}
  .modal .close{position:absolute;top:10px;right:10px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
  .modal-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0 14px;flex-wrap:wrap}
  .modal-tabs button{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:0;cursor:pointer}
  .modal-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .mitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}
  .mitem .row{margin:4px 0;flex-wrap:wrap}
  #action-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:52px}
  #action-bar .btn.active{outline:3px solid var(--gold);outline-offset:1px}
  #action-hint{margin-left:8px;color:var(--muted);font-size:13px;min-height:18px;flex-basis:100%}
  .units{pointer-events:none}
  .unit-chip{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid #ccc;border-radius:8px;padding:4px 8px;cursor:pointer;user-select:none}
  .unit-chip.on{background:#e8f5e9;border-color:var(--ok)}
  .player-chip{cursor:pointer;transition:filter .15s}
  .player-chip:hover{filter:brightness(.95)}
  @media(max-width:600px){.modal-backdrop{align-items:flex-start;padding:8px}.modal{padding:14px;max-height:calc(100vh - 16px)}.modal-tabs button{padding:8px 10px;font-size:14px}#wrap{height:42vh}}
</style>

function _unitName(k) { return S.unitTypes.find(x => x.key === k)?.name || k; }
function _countyName(id) { return S.counties.find(c => c.id === id)?.county_definitions.name || '?'; }
function _nation(id) { return S.players.find(p => p.id === id)?.nation_name || '?'; }
function _resN(k) { return RES[k] || k; }
function snapOf() {

    offers: Object.fromEntries((S.marketOffers||[]).map(o => [o.id, { status:o.status, bidder_id:o.bidder_id, author_id:o.author_id, give_resource:o.give_resource, give_amount:o.give_amount, get_resource:o.get_resource, get_amount:o.get_amount, listing_id:o.listing_id }])),

    orderMembers: Object.fromEntries((S.orderMembers||[]).map(m => [m.id, { status:m.status, player_id:m.player_id, order_id:m.order_id }]))
  };
}
function detectNotifications(prev) {
  if (!prev) return;
  const me = S.actAs; if (!me) return;
  for (const o of (S.marketOffers || [])) {
    if (o.status !== 'pending' || o.author_id !== me || o.bidder_id === me) continue;
    if (!prev.offers[o.id]) notifPush('market_offer', '🏪 Új ajánlat', `${_nation(o.bidder_id)} ajánl: ${o.give_amount}× ${_resN(o.give_resource)} ↔ ${o.get_amount}× ${_resN(o.get_resource)}`);
  }
  for (const o of (S.marketOffers || [])) {
    if (o.bidder_id !== me) continue;
    const p = prev.offers[o.id]; if (!p) continue;
    if (p.status === 'pending' && o.status === 'accepted') notifPush('market_accept', '✅ Ajánlatodat elfogadták', `Kapsz: ${o.get_amount}× ${_resN(o.get_resource)} · Adsz: ${o.give_amount}× ${_resN(o.give_resource)}`);
    else if (p.status === 'pending' && o.status === 'declined') notifPush('market_decline', '❌ Ajánlatodat elutasították', `Visszakapod: ${o.give_amount}× ${_resN(o.give_resource)}`);
  }
  for (const b of (S.battles || [])) {
    if (b.attacker_id !== me && b.defender_id !== me) continue;
    if (!prev.battles[b.id]) {
      if (b.attacker_id === me) notifPush('battle_start_atk', '⚔ Támadás indult', `Megtámadtad ${_countyName(b.county_id)} vármegyét (${_nation(b.defender_id)})`);
      else notifPush('battle_start_def', '🛡 Támadás ért!', `${_nation(b.attacker_id)} megtámadta ${_countyName(b.county_id)} vármegyédet!`);
    }
  }
  for (const bid in prev.battles) {
    const pb = prev.battles[bid];
    if (S.battles.some(b => b.id === bid)) continue;
    const c = S.counties.find(x => x.id === pb.county_id); if (!c) continue;
    const won = c.owner_id === me;
    if (pb.attacker_id === me && !won) notifPush('battle_lost_atk', '❌ Vereség', `Nem sikerült bevenni: ${_countyName(pb.county_id)}`);
    else if (pb.defender_id === me && won) notifPush('battle_won_def', '🛡 Védtél!', `Megtartottad: ${_countyName(pb.county_id)}`);
    const myBefore = Object.values(prev.units).filter(u => u.player_id === me && u.county_id === pb.county_id);
    const myAfter = (S.units || []).filter(u => u.player_id === me && u.county_id === pb.county_id);
    const lost = myBefore.reduce((s,u) => s+u.amount, 0) - myAfter.reduce((s,u) => s+u.amount, 0);
    if (lost > 0) {
      const retreated = (S.movements || []).some(m => m.player_id === me && m.from_county === pb.county_id);
      if (!retreated) notifPush('unit_loss', '💔 Egységveszteség', `${lost} egység elveszett ${_countyName(pb.county_id)} vármegyében`);
    }
  }
  for (const c of (S.counties || [])) {
    const p = prev.counties[c.id]; if (!p) continue;
    const wasMine = p.owner_id === me, isMine = c.owner_id === me;
    if (!wasMine && isMine) notifPush('county_gain', '🏰 Új vármegye', `Elfoglaltad: ${c.county_definitions.name}`);
    else if (wasMine && !isMine) {
      const newOwner = S.players.find(x => x.id === c.owner_id);
      notifPush('county_lost', '⚠ Vármegye elveszett', `${c.county_definitions.name}${newOwner ? ' → ' + newOwner.nation_name : ''}`);
    }
  }
  for (const u of (S.units || [])) {
    if (u.player_id !== me) continue;
    const p = prev.units[u.id]; if (!p) continue;
    if (p.status === 'training' && u.status === 'ready') notifPush('recruit_done', '👥 Kiképzés kész', `${u.amount}× ${_unitName(u.unit_type)} kész`);
  }
  for (const d of (S.diplomacy || [])) {
    if (d.player_a !== me && d.player_b !== me) continue;
    const p = prev.diplomacy[d.player_a + '|' + d.player_b];
    if (p && p.status !== d.status) {
      const other = d.player_a === me ? d.player_b : d.player_a;
      notifPush('diplo_change', '📜 Diplomácia', `${_nation(other)}: ${DIPLO_NAMES[d.status] || d.status}`);
    }
  }
  const myMembership = (S.orderMembers || []).find(m => m.player_id === me && m.status === 'active');
  if (myMembership) {
    const myOrder = (S.orders || []).find(o => o.id === myMembership.order_id);
    if (myOrder && myOrder.founder_id === me) {
      for (const m of (S.orderMembers || [])) {
        if (m.order_id !== myMembership.order_id || m.status !== 'pending') continue;
        if (!prev.orderMembers[m.id]) notifPush('order_apply', '🏰 Új jelentkezés', `${_nation(m.player_id)} jelentkezett a rendbe`);
      }
    }
  }
  for (const m of (S.orderMembers || [])) {
    if (m.player_id !== me) continue;
    const p = prev.orderMembers[m.id]; if (!p) continue;
    if (p.status === 'pending' && m.status === 'active') {
      const o = (S.orders || []).find(x => x.id === m.order_id);
      notifPush('order_accept', '🏰 Rend', `Felvettek a(z) ${o?.name || '?'} rendbe`);
    }
  }
}

function isUnitReady(u) {
  if (!u) return false;
  if (u.status === 'ready') return true;
  if (u.status === 'training' && u.completes_at && new Date(u.completes_at) <= Date.now()) return true;
  return false;
}
function sameOrder(a, b) {
  const ma = (S.orderMembers||[]).find(m => m.player_id === a && m.status === 'active');
  const mb = (S.orderMembers||[]).find(m => m.player_id === b && m.status === 'active');
  return ma && mb && ma.order_id === mb.order_id;
}
function diploStatus(a, b) {
  if (!a || !b || a === b) return 'self';
  if (sameOrder(a, b)) return 'ally';
  const [x, y] = a < b ? [a, b] : [b, a];

}

async function loadState() {

  const [p, c] = await Promise.all([
    sb.from('game_players').select('id,office,nation_name,color,profile_id').eq('game_id', S.sel),
    sb.from('counties').select('id,owner_id,definition_id,capture_bonus').eq('game_id', S.sel)]);
  S.msg = p.error?.message || c.error?.message || '';
  const ids = (c.data || []).map(x => x.id), pids = (p.data || []).map(x => x.profile_id).filter(Boolean);
  S.players = (p.data || []).map(x => ({ ...x, profiles:null }));

  else S.actAs = S.players.find(x => x.profile_id === S.user.id)?.id || null;
  const [b, pr, pd, rs, mp, un, bt, mv, dip, ord, sc] = await Promise.all([
    ids.length ? sb.from('buildings').select('county_id,building_type,level,status,completes_at').in('county_id', ids) : { data:[] },
    pids.length ? sb.from('profiles').select('id,username').in('id', pids) : { data:[] },
    sb.from('county_production').select('county_id,owner_id,resource,rate_per_hour,cap_amount,current_amount').eq('game_id', S.sel),
    S.actAs ? sb.from('player_resources').select('resource,amount').eq('player_id', S.actAs) : { data:[] },
    S.actAs ? sb.rpc('refresh_manpower', { p_player:S.actAs }) : { data:null },
    sb.from('player_units').select('*').eq('game_id', S.sel).then(x => x.error ? { data:[] } : x),
    sb.from('battles').select('*').eq('game_id', S.sel).eq('status','active').then(x => x.error ? { data:[] } : x),
    sb.from('army_movements').select('*').eq('game_id', S.sel).eq('status','marching').then(x => x.error ? { data:[] } : x),
    sb.from('diplomacy').select('*').eq('game_id', S.sel).then(x => x.error ? { data:[] } : x),
    sb.from('orders').select('*').eq('game_id', S.sel).then(x => x.error ? { data:[] } : x),
    sb.rpc('get_game_scores', { p_game: S.sel }).then(x => x.error ? { data:null } : x)]);
  const names = Object.fromEntries((pr.data || []).map(x => [x.id, x.username]));
  S.players = S.players.map(x => ({ ...x, profiles: x.profile_id ? { username:names[x.profile_id] } : null }));
  S.prod = pd.data || []; S.prodAt = Date.now();
  S.res = Object.fromEntries((rs.data || []).map(x => [x.resource, Number(x.amount)]));
  S.mp = mp.data || null; S.mpAt = Date.now();
  S.units = un.data || [];
  S.battles = bt.data || [];
  S.movements = mv.data || [];
  S.diplomacy = dip.data || [];
  S.orders = ord.data || [];
  S.scores = sc?.data || null;
  S.scoresAt = Date.now();
  if (S.orders.length) {
    const ordm = await sb.from('order_members').select('*').in('order_id', S.orders.map(o => o.id));
    S.orderMembers = ordm.data || [];
  } else S.orderMembers = [];
  if (S.selectedUnits.length) {
    const validIds = new Set((S.units||[]).filter(u => u.player_id === S.actAs && isUnitReady(u)).map(u => u.id));
    S.selectedUnits = S.selectedUnits.filter(id => validIds.has(id));
  }
  const defs = Object.fromEntries((S.defs || []).map(d => [d.id, d]));
  S.counties = (c.data || []).filter(x => defs[x.definition_id]).map(x => ({ id:x.id, owner_id:x.owner_id, capture_bonus: x.capture_bonus || 0,
    county_definitions:{ name:defs[x.definition_id].name, features:defs[x.definition_id].features || [], county_resources:S.cres[x.definition_id] || [] },
    buildings:(b.data || []).filter(y => y.county_id === x.id) }));
  if (!S.counties.length && !S.msg) S.msg = 'Nem találok vármegyéket.';
  S.byName = Object.fromEntries(S.counties.map(x => [x.county_definitions.name, x]));

  const _notifKeyNow = 'palyi_notifs_' + (S.sel||'') + '_' + (S.actAs||'');
  if (S._notifKey !== _notifKeyNow) { S._notifKey = _notifKeyNow; notifLoad(); }
  if (_prevSnap && _prevActAs === S.actAs && _prevSel === S.sel) {
    try { detectNotifications(_prevSnap); } catch(e) { console.warn('detect:', e); }
  }
  S.snap = snapOf();
  S._lastActAs = S.actAs;
  S._lastSel = S.sel;
}

    <span class="grow"></span>` +
    (adm ? `<button class="btn" onclick="setStatus('running')" ${g.status === 'running' ? 'disabled' : ''}>▶ Indítás</button>
    <button class="btn ghost" onclick="setStatus('paused')" ${g.status !== 'running' ? 'disabled' : ''}>⏸ Szünet</button>
    <button class="btn ghost" onclick="setStatus('finished')" ${g.status === 'finished' ? 'disabled' : ''}>■ Lezárás</button>
    <button class="btn ghost" onclick="openTargetModal()">🎯 Cél</button>
    <button class="btn ghost" onclick="openWinnerModal()">🏆 Győztes</button>
    <button class="btn ghost" onclick="seedTest()">Teszt</button>
    <button class="btn danger" onclick="delGame()">Törlés</button>` : '') + `</div>
    ${S.msg ? `<p class="err">${esc(S.msg)}</p>` : ''}

    <div id="status" style="margin-top:10px"></div><div id="pick" style="margin-top:10px"></div></div>
    <div id="wrap"><div class="zoom"><button class="btn ghost" onclick="setZoom(Z-.15)">−</button><button class="btn ghost" onclick="setZoom(null)">⤢</button><button class="btn ghost" onclick="setZoom(Z+.15)">+</button></div>
    <div id="msz"><div id="map"></div></div></div>

  buildMap(); setZoom(Z);
  if (sc) { $('wrap').scrollLeft = sc[0]; $('wrap').scrollTop = sc[1]; }
  renderGameUpdate();
}

function renderGameUpdate() {
  if (!els || Object.keys(els).length === 0) { renderGame(); return; }
  paintAll();
  renderStatus();
  renderPlayerChips();
  if (S.picked) renderPick(); else { const el = $('pick'); if (el) el.innerHTML = '<span style="color:var(--muted)">Kattints egy vármegyére.</span>'; }
  const ab = $('action-bar'); if (ab) ab.innerHTML = renderActionBar();
  notifUpdateBadge();
}

function renderPlayerChips() {
  const el = $('player-chips');
  if (!el) return;
  const cnt = id => S.counties.filter(c => c.owner_id === id).length;
  const g = S.games.find(x => x.id === S.sel);
  const target = g?.target_score;
  const scores = S.scores?.players || {};
  const maxScore = Math.max(0, ...Object.values(scores).map(s => s.total || 0));
  el.innerHTML = S.players.map(p => {
    const d = p.id === S.actAs ? 'self' : diploStatus(S.actAs, p.id);
    const dCol = DIPLO_COLORS[d] || '#888';
    const dName = d === 'self' ? 'Te' : (DIPLO_NAMES[d] || 'Semleges');
    const s = scores[p.id] || {};
    const total = s.total || 0;
    const isLeader = total > 0 && total === maxScore;
    const reachedTarget = target && total >= target;
    const scoreColor = reachedTarget ? '#b00020' : isLeader ? 'var(--gold)' : 'var(--ink)';
    return `<span class="chip player-chip" style="background:${esc(p.color)}26;border:2px solid ${dCol}" onclick="openPlayerStats('${p.id}')" title="Kattints a statisztikákhoz">
      <span class="dot" style="background:${esc(p.color)}"></span>
      ${esc(p.nation_name)} · ${p.profiles?.username ? esc(p.profiles.username) : '<i>teszt</i>'} · ${cnt(p.id)} várm. · <b style="color:${dCol}">${dName}</b>
      · <b style="color:${scoreColor}">${total} pont${reachedTarget ? ' 🏆' : ''}</b>
    </span>`;
  }).join('') || 'Még nincs játékos.';
}

function setZoom(z) {
  if (z === null || z === undefined) z = Math.max(.3, Math.min(1, ($('wrap').clientWidth - 6) / 1400));
  Z = Math.max(.3, Math.min(1.5, z));
  $('map').style.transform = `scale(${Z})`; $('msz').style.width = 1400 * Z + 'px'; $('msz').style.height = 1000 * Z + 'px';
}

function buildMap() {
  els = {};
  const mapEl = $('map');
  Object.keys(POS).forEach(n => {
    const box = document.createElement('div');
    box.className = 'county-svg'; box.style.left = POS[n].left; box.style.top = POS[n].top;
    box.onmouseenter = e => { S.hoverTarget = S.byName[n]?.id || null; if (S.actionPhase === 'select-target') renderRoutes(); tip(n, e); };
    box.onmousemove = moveTip;
    box.onmouseleave = () => { S.hoverTarget = null; if (S.actionPhase === 'select-target') renderRoutes(); $('tooltip').style.display = 'none'; };
    box.onclick = e => { pick(n); tip(n, e); };
    mapEl.appendChild(box); els[n] = box;
    (svgCache[n] ??= fetch('svg/' + n + '.svg').then(r => r.ok ? r.text() : '').catch(() => '')).then(t => {
      box.appendChild(t ? new DOMParser().parseFromString(t, 'image/svg+xml').querySelector('svg')
        : new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="18" fill="#d3d3d3"><rect width="26" height="18" rx="4" stroke="#fff"/></svg>', 'image/svg+xml').querySelector('svg'));
      paint(n);
    });
  });
  renderRoutes();
}

const _norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function _bKey(b){ return _norm(b.building_type); }
function _bName(b){ return _norm(S.btypes[b.building_type] || ''); }
function isLaktanya(b){ const k=_bKey(b),n=_bName(b); return ['laktanya','barracks','gyar'].includes(k) || ['laktanya','barracks','gyar'].includes(n); }
function isVarOrVaros(b){ const k=_bKey(b),n=_bName(b); return ['var','varos','castle','city'].includes(k) || ['var','varos','vár','város','castle','city'].includes(n); }
function isComplete(b){ return !b.completes_at || new Date(b.completes_at) <= Date.now(); }
function isSameBType(stored, uiB){ return _bKey(stored)===_norm(uiB.key) || _bName(stored)===_norm(uiB.name); }
function biconFor(b) { return BICON[_norm(b.building_type)] || BICON[_norm(S.btypes[b.building_type])] || null; }

function countyCenter(name) {
  const box = els[name]; const svg = box?.querySelector('svg'); const p = POS[name];
  if (!p) return null;
  let w = 26, h = 18;
  if (svg) {
    const vb = svg.getAttribute('viewBox');
    if (vb) { const parts = vb.split(/\s+/).map(Number); if (parts.length === 4) { w = parts[2]; h = parts[3]; } }
    else { w = parseFloat(svg.getAttribute('width')) || w; h = parseFloat(svg.getAttribute('height')) || h; }
  }
  return { x: parseFloat(p.left) + w / 2, y: parseFloat(p.top) + h / 2 };
}

function renderRoutes() {
  const old = $('route-svg'); if (old) old.remove();
  const mapEl = $('map'); if (!mapEl) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'route-svg';
  svg.setAttribute('width', 1400); svg.setAttribute('height', 1000);
  svg.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;z-index:5;opacity:0.85;';
  for (const m of visibleMovements()) {
    const fromC = S.counties.find(c => c.id === m.from_county);
    const toC = S.counties.find(c => c.id === m.to_county);
    if (!fromC || !toC) continue;
    const from = countyCenter(fromC.county_definitions.name);
    const to = countyCenter(toC.county_definitions.name);
    if (!from || !to) continue;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x); line.setAttribute('y2', to.y);
    line.setAttribute('stroke', m.action === 'attack' ? '#d00000' : '#ff9800');
    line.setAttribute('stroke-width', '2'); line.setAttribute('stroke-dasharray', '8,4');
    svg.appendChild(line);
  }
  if (S.actionPhase === 'select-target' && S.hoverTarget && S.actionSource) {
    const srcC = S.counties.find(c => c.id === S.actionSource);
    const tgtC = S.counties.find(c => c.id === S.hoverTarget);
    if (srcC && tgtC) {
      const from = countyCenter(srcC.county_definitions.name);
      const to = countyCenter(tgtC.county_definitions.name);
      if (from && to) {
        const isAdj = adjacentToSource(tgtC.county_definitions.name);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x); line.setAttribute('y2', to.y);
        line.setAttribute('stroke', isAdj ? '#b8892b' : '#d00000');
        line.setAttribute('stroke-width', '3'); line.setAttribute('stroke-dasharray', '12,6');
        svg.appendChild(line);
      }
    }
  }
  mapEl.appendChild(svg);
}

function paint(n) {
  const box = els[n]; if (!box) return;
  const c = S.byName[n]; if (!c) return;
  const p = S.players.find(x => x.id === c.owner_id);
  const svg = box.querySelector('svg');
  if (svg) svg.setAttribute('fill', p ? p.color : '#d3d3d3');
  const diplo = ownerDiplo(c.owner_id);
  const battleHere = (S.battles || []).find(b => b.county_id === c.id && b.status === 'active');
  const isSource = S.actionPhase && S.actionSource === c.id;
  const inTargetPhase = S.actionPhase === 'select-target';
  const isAdjacent = inTargetPhase && S.actionSource && !isSource && adjacentToSource(n);
  const isNonAdjacent = inTargetPhase && S.actionSource && !isSource && !isAdjacent;
  let filter = '';
  if (isSource) filter = 'drop-shadow(0 0 10px gold) drop-shadow(0 0 5px gold)';
  else if (battleHere) filter = 'drop-shadow(0 0 12px rgba(220,0,0,1)) drop-shadow(0 0 6px rgba(255,0,0,.7))';
  else if (isAdjacent) filter = 'drop-shadow(0 0 7px #b8892b) drop-shadow(0 0 4px #b8892b)';
  else if (DIPLO_COLORS[diplo] && !isNonAdjacent) filter = `drop-shadow(0 0 6px ${DIPLO_COLORS[diplo]}) drop-shadow(0 0 3px ${DIPLO_COLORS[diplo]})`;
  if (box.style.filter !== filter) box.style.filter = filter;
  const opacity = isNonAdjacent ? '0.2' : '1';
  if (box.style.opacity !== opacity) box.style.opacity = opacity;
  const cursor = isNonAdjacent ? 'not-allowed' : 'pointer';
  if (box.style.cursor !== cursor) box.style.cursor = cursor;

  let iconBox = box.querySelector('.bicons');
  if (!iconBox) {
    iconBox = document.createElement('div'); iconBox.className = 'bicons';
    iconBox.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;width:90%;pointer-events:none;z-index:3;';
    box.appendChild(iconBox);
  }
  const icons = [], seen = new Set();
  for (const b of (c.buildings || [])) {
    const src = biconFor(b); if (!src || seen.has(src)) continue; seen.add(src);
    const inProgress = b.completes_at && new Date(b.completes_at) > Date.now();
    icons.push({ src, inProgress });
  }
  iconBox.innerHTML = icons.map(({ src, inProgress }) =>
    `<img src="${src}" alt="" style="width:14px;height:14px;object-fit:contain;opacity:${inProgress ? '.4' : '1'};filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))">`
  ).join('');

  let unitsBox = box.querySelector('.units');
  if (!unitsBox) {
    unitsBox = document.createElement('div'); unitsBox.className = 'units';
    unitsBox.style.cssText = 'position:absolute;bottom:1px;left:0;right:0;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-items:center;z-index:4;pointer-events:none;';
    box.appendChild(unitsBox);
  }
  const visible = (S.units || []).filter(u => u.county_id === c.id && (u.player_id === S.actAs || diploStatus(S.actAs, u.player_id) === 'ally'));
  const marching = incomingTo(c.id);
  const visibleHtml = visible.map(u => {
    const isSelf = u.player_id === S.actAs;
    const isSelected = S.selectedUnits.includes(u.id);
    const bg = isSelf ? '#555' : '#9c27b0';
    const src = UNIT_ICONS[u.unit_type];
    const icon = src ? `<img src="${src}" onerror="imgFallback(this)" style="width:11px;height:11px;object-fit:contain;" alt="">`
      : `<span style="display:inline-block;width:10px;height:10px;background:${bg};border:1px solid #222;box-sizing:border-box;"></span>`;
    const border = isSelected ? '2px solid gold' : '1px solid transparent';
    return `<span class="unit-icon" data-uid="${u.id}" style="display:inline-flex;align-items:center;gap:1px;background:rgba(0,0,0,.65);border-radius:3px;padding:0 2px;border:${border};">${icon}<span style="font-size:9px;font-weight:700;color:#fff;">${u.amount}</span></span>`;
  }).join('');
  const marchingHtml = marching.map(m => {
    const src = UNIT_ICONS[m.unit_type];
    const icon = src ? `<img src="${src}" onerror="imgFallback(this)" style="width:11px;height:11px;object-fit:contain;opacity:.5" alt="">`
      : `<span style="display:inline-block;width:10px;height:10px;background:#888;border:1px dashed #ff9800;box-sizing:border-box;"></span>`;
    return `<span class="unit-icon marching" title="Közeledik" style="display:inline-flex;align-items:center;gap:1px;background:rgba(0,0,0,.4);border-radius:3px;padding:0 2px;border:1px dashed #ff9800;">${icon}<span style="font-size:9px;font-weight:700;color:#fff;">${m.amount}</span></span>`;
  }).join('');
  unitsBox.innerHTML = visibleHtml + marchingHtml;
}

function paintAll() { for (const n of Object.keys(els)) paint(n); renderRoutes(); }

function info(n) {
  const c = S.byName[n]; if (!c) return `<b>${esc(n)}</b> (nincs)`;
  const d = c.county_definitions, p = S.players.find(x => x.id === c.owner_id);
  const b = c.buildings.map(x => (S.btypes[x.building_type] || x.building_type) + ' ' + x.level + '. szint' + (x.completes_at && new Date(x.completes_at) > Date.now() ? ' (épül)' : '')).join(', ') || 'nincs';
  const units = (S.units || []).filter(u => u.county_id === c.id && (u.player_id === S.actAs || diploStatus(S.actAs, u.player_id) === 'ally'));
  const unitsByPlayer = {};
  for (const u of units) {
    const ut = S.unitTypes.find(x => x.key === u.unit_type);
    const hpPct = Math.round((u.hp_ratio || 1) * 100);
    const training = !isUnitReady(u);
    const tag = `${u.amount}× ${ut?.name || u.unit_type}${hpPct < 100 ? ` (${hpPct}%)` : ''}${training ? ' (kik.)' : ''}`;
    (unitsByPlayer[u.player_id] = unitsByPlayer[u.player_id] || []).push(tag);
  }
  let unitStr = '';
  if (Object.keys(unitsByPlayer).length) {
    for (const [pid, tags] of Object.entries(unitsByPlayer)) unitStr += `<br>· <b>${esc(S.players.find(x => x.id === pid)?.nation_name || '?')}</b>: ${tags.join(', ')}`;
  } else unitStr = ' –';
  const incoming = incomingTo(c.id);
  let incomingStr = '';
  if (incoming.length) incomingStr = '<br><small style="color:#b26a00">→ Közeledik: ' + incoming.map(m => { const eta = (new Date(m.arrive_at) - Date.now()) / 1000; return `${m.amount}× ${S.unitTypes.find(x => x.key === m.unit_type)?.name || m.unit_type} (${fmtT(eta)})`; }).join(', ') + '</small>';
  const battleHere = (S.battles || []).find(x => x.county_id === c.id && x.status === 'active');
  const battleStr = battleHere ? `<br><b style="color:#b00020">⚔ CSATA FOLYIK</b>` : '';
  const diplo = ownerDiplo(c.owner_id);
  let diploStr = '';
  if (diplo === 'self') diploStr = ' <b style="color:var(--ok)">(te)</b>';
  else if (diplo === 'unowned') diploStr = ' <small style="color:#888">(uralatlan — 1-es helyőrség)</small>';
  else diploStr = ` <small>· viszony: <b style="color:${DIPLO_COLORS[diplo] || '#666'}">${DIPLO_NAMES[diplo] || diplo}</b></small>`;
  const cb = c.capture_bonus || 0;
  const bonusStr = cb > 0 ? ` <small style="color:var(--gold)">(+${cb} pont)</small>` : '';
  return `<b style="font:700 17px Georgia,serif">${esc(n)}</b><br>
    Tulajdonos: ${p ? esc(p.nation_name) + (p.profiles?.username ? ' (' + esc(p.profiles.username) + ')' : ' (teszt)') : 'senkié'}${diploStr}${bonusStr}<br>
    Termel: ${d.county_resources.map(r => RES[r.resource]).join(', ') || '–'}<br>
    Egyéb: ${esc(d.features.join(', ')) || '–'}<br>
    Épületek: ${esc(b)}<br>
    Katonaság:${unitStr}${incomingStr}${battleStr}`;
}
function tip(n, e) { const t = $('tooltip'); t.innerHTML = info(n); t.style.display = 'block'; moveTip(e); }
function moveTip(e) { const t = $('tooltip'); t.style.left = e.pageX + 12 + 'px'; t.style.top = e.pageY + 12 + 'px'; }

const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + 'ó ' : '') + (h || m ? m + 'p ' : '') + (s % 60) + 'mp'; };
const num = x => (Math.floor(x * 10) / 10).toLocaleString('hu-HU');
const liveAmt = r => Math.min(Number(r.cap_amount), Number(r.current_amount) + Number(r.rate_per_hour) * (Date.now() - S.prodAt) / 3.6e6);
const curMp = () => S.mp ? Math.max(S.mp.manpower, Math.min(S.mp.cap, S.mp.manpower + S.mp.rate * (Date.now() - S.mpAt) / 3.6e6)) : 0;
const costHtml = cost => Object.entries(cost || {}).map(([k, v]) => `${v} ${RES[k] || k}`).join(', ');
const effectHtml = b => [b.production_bonus > 0 && `+${Math.round(b.production_bonus * 100)}% termelés`, b.manpower_bonus > 0 && `+${b.manpower_bonus} munkaerő/óra`, b.defense_bonus > 0 && `+${Math.round(b.defense_bonus * 100)}% védelem`].filter(Boolean).join(', ') || '–';

let _busy = false;
let _pendingRefresh = false;
const refreshNow = async () => {
  if (!S.sel) return;
  if (_busy) { _pendingRefresh = true; return; }
  _busy = true;
  do {
    _pendingRefresh = false;
    if (!S.sel) break;
    try { await sb.rpc('tick_military', {p_game:S.sel}); } catch(e){ console.warn('tick_military:', e.message); }
    try { await loadState(); } catch(e) { console.error('loadState:', e); S.msg = 'Hiba: ' + e.message; }
    if (!els || Object.keys(els).length === 0) renderGame(); else renderGameUpdate();
  } while (_pendingRefresh);
  _busy = false;
};

let tickMilitaryRunning = false;
let tickMilitaryCounter = 0;
async function tickMilitary() {
  if (tickMilitaryRunning || _busy) return;
  if (!S.sel || S.demo) return;
  const hasPending = (S.movements || []).length > 0 || (S.battles || []).length > 0;
  if (!hasPending) return;
  tickMilitaryRunning = true;
  try { await sb.rpc('tick_military', {p_game:S.sel}); } catch(e){ console.warn('tick_military:', e.message); }
  try { await loadState(); } catch(e) { console.error('loadState:', e); }
  if (els && Object.keys(els).length) renderGameUpdate();
  tickMilitaryRunning = false;
}

async function setActAs(v) { S.actAs = v; await refreshNow(); }

function pick(n) {
  const c = S.byName[n]; if (!c) return;
  if (S.actionPhase === 'select-county') {
    if ((S.battles || []).some(b => b.county_id === c.id && b.status === 'active')) { updateActionHint('⚔ Ebben a vármegyében csata folyik — innen nem tudsz egységet mozgatni.'); return; }
    const units = (S.units||[]).filter(u => u.county_id === c.id && u.player_id === S.actAs && isUnitReady(u));
    if (!units.length) {
      if (c.owner_id !== S.actAs) {
        const d = ownerDiplo(c.owner_id);
        if (d === 'ally' || d === 'coop') updateActionHint('Ezen a szövetséges területen nincs saját mozgatható egységed.');
        else updateActionHint('Ez nem a te vármegyéd, és nincs itt mozgatható egységed.');
      } else updateActionHint('Ebben a vármegyében nincs mozgatható egységed.');
      return;
    }
    S.actionSource = c.id; S.actionSourceName = n; S.actionPhase = 'select-units';
    S.selectedUnits = units.map(u => u.id);
    renderGameUpdate(); updateActionHint('Válaszd ki az egységeket, majd "Cél kiválasztása".');
    return;
  }
  if (S.actionPhase === 'select-target') {
    if (c.id === S.actionSource) { updateActionHint('A cél nem lehet azonos a forrással.'); return; }
    if (!adjacentToSource(n)) { updateActionHint('⛔ Csak a szomszédos vármegyékre mozoghatsz (arannyal jelölve).'); return; }
    if (S.actionMode === 'attack') {
      const d = ownerDiplo(c.owner_id);
      if (d === 'coop' || d === 'ally') { alert('Szövetségesre / együttműködőre nem támadhatsz.'); return; }
      if (d === 'self') { alert('Saját vármegyére nem támadhatsz.'); return; }
    }
    S.actionTarget = c.id;
    openSendModal(S.actionSource, c.id, S.actionMode);
    return;
  }
  clearTimeout(S.pickTimeout);
  S.picked = n; renderPick();
  S.pickTimeout = setTimeout(() => { S.picked = null; const el = $('pick'); if (el) el.innerHTML = '<span style="color:var(--muted)">Kattints egy vármegyére.</span>'; }, 5000);
}
function updateActionHint(t) { const el = $('action-hint'); if (el) el.textContent = t || ''; }
function startAction(mode) {
  if (S.actionMode === mode) { cancelAction(); return; }
  S.actionMode = mode; S.actionPhase = 'select-county';
  S.selectedUnits = []; S.actionSource = null; S.actionSourceName = null; S.actionTarget = null; S.hoverTarget = null;
  clearTimeout(S.pickTimeout); renderGameUpdate();
  const hints = { attack:'⚔ Támadás: kattints egy saját vármegyére.', defend:'🛡 Védekezés: kattints egy saját vármegyére.', move:'→ Mozgatás: kattints egy saját vármegyére.' };
  updateActionHint(hints[mode] || '');

function closeSendModal() { $('send-modal')?.remove(); }
async function confirmSend(action) {
  const src = S.actionSource, tgt = S.actionTarget;
  if (!src || !tgt) return closeSendModal();
  const units = S.selectedUnits.map(id => (S.units||[]).find(u => u.id === id)).filter(Boolean);

  if (!sends.length) { $('send-msg').textContent = 'Válassz legalább 1 egységet.'; return; }
  let ok = 0, errs = [];
  for (const s of sends) {
    const { error } = await sb.rpc('send_army', { p_unit_id: s.id, p_to_county: tgt, p_amount: s.amount, p_action: action === 'attack' ? 'attack' : 'move', p_player: S.actAs });
    if (error) {
      if (/Nem szomszédos/i.test(error.message)) errs.push('A szerver még a régi szomszédság-ellenőrzést használja (013_adjacency.sql).');
      else if (/Csata folyik a forrásban/i.test(error.message)) errs.push('Csata folyik a forrásban.');

function tick() {
  document.querySelectorAll('[data-lv]').forEach(e => { const [cid, res] = e.dataset.lv.split('|'); const r = S.prod.find(x => x.county_id === cid && x.resource === res); if (r) e.textContent = num(liveAmt(r)); });
  const mp = $('mpv'); if (mp) mp.textContent = Math.floor(curMp());
  const pd = $('pend');
  if (pd) {
    const cnt = Math.floor(S.prod.filter(r => r.owner_id === S.actAs).reduce((a, r) => a + liveAmt(r), 0));
    pd.textContent = cnt;
    const btn = $('collect-btn'); if (btn) btn.disabled = cnt === 0;
  }
  document.querySelectorAll('[data-end]').forEach(e => { const s = (Date.parse(e.dataset.end) - Date.now()) / 1000; e.textContent = fmtT(s); if (s <= 0 && !S.fin[e.dataset.end]) { S.fin[e.dataset.end] = 1; setTimeout(refreshNow, 800); } });
  document.querySelectorAll('[data-unit-end]').forEach(e => { const u = (S.units || []).find(x => x.id === e.dataset.unitEnd); if (!u || !u.completes_at) { e.textContent = '–'; return; } const s = (Date.parse(u.completes_at) - Date.now()) / 1000; e.textContent = fmtT(s); if (s <= 0 && !S.fin['u_' + u.id]) { S.fin['u_' + u.id] = 1; setTimeout(refreshNow, 800); } });
  tickMilitaryCounter++;
  const hasBattle = (S.battles || []).length > 0;
  const interval = hasBattle ? 3 : 5;
  if (tickMilitaryCounter >= interval) { tickMilitaryCounter = 0; tickMilitary(); }
}

/* Piac */
async function openMarket() {
  if (S.demo) return alert('Demóban nem.');
  if (!S.actAs || $('market-backdrop')) return;
  document.body.insertAdjacentHTML('beforeend', `<div class="modal-backdrop" id="market-backdrop" onclick="if(event.target===this)closeMarket()"><div class="modal"><button class="close" onclick="closeMarket()">✕</button><h2>🏪 Piac</h2><div id="market-content">Betöltés…</div></div></div>`);
  S.marketTab = 'browse'; await loadMarketAndRender();
}
function closeMarket() { $('market-backdrop')?.remove(); }
async function loadMarket() {
  if (S.demo || !S.actAs || !S.sel) return;
  const [l, o] = await Promise.all([
    sb.from('market_listings').select('*').eq('game_id', S.sel).order('created_at', { ascending:false }),
    sb.from('market_offers').select('*').eq('game_id', S.sel).order('created_at', { ascending:false })]);
  if (l.error) S.msg = l.error.message;
  if (o.error) S.msg = o.error.message;
  S.marketListings = l.data || []; S.marketOffers = o.data || [];
}
async function loadMarketAndRender() { await loadMarket(); renderMarket(); }
async function marketTab(t) { S.marketTab = t; await loadMarketAndRender(); }
const resName = r => RES[r] || r;
const listingTitle = l => l.kind === 'sell' ? `Kínál: ${l.amount}× ${resName(l.resource)}` : `Keres: ${l.amount}× ${resName(l.resource)}`;
function playerName(pid) { const p = S.players.find(x => x.id === pid); return p ? esc(p.nation_name) : '(?)'; }
function renderMarket() {
  const el = $('market-content'); if (!el) return;
  const tab = S.marketTab || 'browse', me = S.actAs;
  let h = `<div class="modal-tabs"><button class="${tab==='browse'?'on':''}" onclick="marketTab('browse')">Hirdetések</button><button class="${tab==='mine'?'on':''}" onclick="marketTab('mine')">Saját</button><button class="${tab==='offers'?'on':''}" onclick="marketTab('offers')">Ajánlataim</button><button class="${tab==='new'?'on':''}" onclick="marketTab('new')">➕ Új</button></div>`;
  if (tab === 'browse') h += renderMarketBrowse(me);
  else if (tab === 'mine') h += renderMarketMine(me);
  else if (tab === 'offers') h += renderMarketOffers(me);
  else h += renderMarketNew();
  el.innerHTML = h;
}
function renderMarketBrowse(me) {
  const others = (S.marketListings || []).filter(l => l.status === 'open' && l.author_id !== me);
  if (!others.length) return '<p style="color:var(--muted)">Nincs más nyitott hirdetés.</p>';
  return others.map(l => {
    const my = (S.marketOffers || []).find(o => o.listing_id === l.id && o.bidder_id === me && o.status === 'pending');
    return `<div class="mitem"><div class="row"><b class="grow">${listingTitle(l)}</b><small>${playerName(l.author_id)}</small></div><div style="color:var(--muted);font-size:12px;margin:4px 0">${new Date(l.created_at).toLocaleString('hu-HU')}</div>${my ? `<div class="chip" style="background:#e8f5e9">Ajánlatod: ${my.give_amount}× ${resName(my.give_resource)} ↔ ${my.get_amount}× ${resName(my.get_resource)}</div>` : `<button class="btn ghost" onclick="marketOfferForm('${l.id}')">Ajánlat tétel</button><div id="offer-form-${l.id}" style="display:none;margin-top:8px"><div class="row"><label style="font-size:13px">${l.kind === 'sell' ? 'Te adod:' : 'Te kapod:'}<select id="of-res-${l.id}">${Object.keys(RES).filter(k => k !== l.resource).map(k => `<option value="${k}">${RES[k]}</option>`).join('')}</select></label><input id="of-amt-${l.id}" type="number" min="1" value="1" style="width:90px"><button class="btn" onclick="marketSubmitOffer('${l.id}')">Küldés</button></div></div>`}</div>`;
  }).join('');
}
function marketOfferForm(lid) { const el = $('offer-form-' + lid); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
async function marketSubmitOffer(lid) {
  const res = $('of-res-' + lid)?.value, amt = Number($('of-amt-' + lid)?.value);
  if (!amt || amt < 1) return alert('Adj meg mennyiséget.');
  const { error } = await sb.rpc('market_offer', { p_listing: lid, p_player: S.actAs, p_resource: res, p_amount: amt });
  if (error) return alert(error.message);
  await loadMarketAndRender(); await refreshNow();
}
function renderMarketMine(me) {
  const mine = (S.marketListings || []).filter(l => l.author_id === me);
  if (!mine.length) return '<p style="color:var(--muted)">Még nincs hirdetésed.</p>';
  return mine.map(l => {
    const pending = (S.marketOffers || []).filter(o => o.listing_id === l.id && o.status === 'pending');
    const badge = { open:'🟢 nyitott', done:'✅ kész', cancelled:'⚪ visszavonva' }[l.status] || l.status;
    let h = `<div class="mitem"><div class="row"><b class="grow">${listingTitle(l)}</b><span class="chip">${badge}</span></div>`;
    if (l.status === 'open') h += `<div class="row" style="margin-top:6px"><button class="btn danger" onclick="marketCancel('${l.id}')">Visszavonás</button></div>`;
    if (pending.length) h += pending.map(o => `<div class="row" style="margin:6px 0;padding:8px;background:#f8f4e8;border-radius:6px"><span class="grow">${playerName(o.bidder_id)}: ad <b>${o.give_amount}× ${resName(o.give_resource)}</b>, kap <b>${o.get_amount}× ${resName(o.get_resource)}</b></span><button class="btn" onclick="marketDecide('${o.id}', true)">Elfogad</button><button class="btn ghost" onclick="marketDecide('${o.id}', false)">Elutasít</button></div>`).join('');
    return h + '</div>';
  }).join('');
}
function renderMarketOffers(me) {
  const mine = (S.marketOffers || []).filter(o => o.bidder_id === me);
  if (!mine.length) return '<p style="color:var(--muted)">Még nincs ajánlatod.</p>';
  return mine.map(o => {
    const l = (S.marketListings || []).find(x => x.id === o.listing_id);
    const st = { pending:'⏳ függő', accepted:'✅ elfogadva', declined:'❌ elutasítva', withdrawn:'⚪ visszavonva' }[o.status] || o.status;
    return `<div class="mitem"><div class="row"><b class="grow">${l ? listingTitle(l) : '(törölt)'}</b><span class="chip">${st}</span></div><div style="font-size:13px">Adok: <b>${o.give_amount}× ${resName(o.give_resource)}</b> · Kapok: <b>${o.get_amount}× ${resName(o.get_resource)}</b></div>${o.status === 'pending' ? `<div class="row" style="margin-top:6px"><button class="btn ghost" onclick="marketWithdraw('${o.id}')">Visszavonás</button></div>` : ''}</div>`;
  }).join('');
}
function renderMarketNew() {
  return `<div class="mitem"><label style="display:block;margin-bottom:8px">Típus<br><select id="nl-kind" style="width:100%;max-width:420px"><option value="sell">Kínálok</option><option value="buy">Keresek</option></select></label><div class="row"><label>Nyersanyag <select id="nl-res">${Object.keys(RES).map(k => `<option value="${k}">${RES[k]}</option>`).join('')}</select></label><label>Mennyiség <input id="nl-amt" type="number" min="1" value="1" style="width:100px"></label><button class="btn" onclick="marketSubmitCreate()">Létrehozás</button></div></div>`;
}
async function marketSubmitCreate() {
  const kind = $('nl-kind')?.value, res = $('nl-res')?.value, amt = Number($('nl-amt')?.value);
  if (!amt || amt < 1) return alert('Adj meg mennyiséget.');
  const { error } = await sb.rpc('market_post', { p_player: S.actAs, p_kind: kind, p_resource: res, p_amount: amt });
  if (error) return alert(error.message);
  S.marketTab = 'mine'; await loadMarketAndRender(); await refreshNow();
}
async function marketCancel(lid) { if (!confirm('Visszavonod?')) return; const { error } = await sb.rpc('market_cancel', { p_listing: lid }); if (error) return alert(error.message); await loadMarketAndRender(); await refreshNow(); }
async function marketWithdraw(oid) { if (!confirm('Visszavonod?')) return; const { error } = await sb.rpc('market_withdraw', { p_offer: oid }); if (error) return alert(error.message); await loadMarketAndRender(); await refreshNow(); }
async function marketDecide(oid, accept) { if (!confirm(accept ? 'Elfogadod?' : 'Elutasítod?')) return; const { error } = await sb.rpc('market_decide', { p_offer: oid, p_accept: accept }); if (error) return alert(error.message); await loadMarketAndRender(); await refreshNow(); }

function openDiplomacy() {
  if (S.demo) return alert('Demóban nem.');
  if (!S.actAs || $('diplo-modal')) return;
  const others = S.players.filter(p => p.id !== S.actAs);
  let h = `<div class="modal-backdrop" id="diplo-modal" onclick="if(event.target===this)closeDiplomacy()"><div class="modal"><button class="close" onclick="closeDiplomacy()">✕</button><h2>📜 Diplomácia</h2><p style="color:var(--muted);font-size:13px">Társ csak vitézi renden belül lehetséges.</p><div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:12px"><span>⚔ Hadi: <span style="background:#d00000;color:#fff;padding:1px 6px;border-radius:4px">vörös</span></span><span>Semleges: nincs szín</span><span>🤝 Együttműk.: <span style="background:#1b5e20;color:#fff;padding:1px 6px;border-radius:4px">zöld</span></span><span>💜 Társ: <span style="background:#6a1b9a;color:#fff;padding:1px 6px;border-radius:4px">lila</span></span></div><div>`;
  for (const p of others) {
    const st = diploStatus(S.actAs, p.id);
    const stName = DIPLO_NAMES[st] || 'Semleges';
    const stColor = DIPLO_COLORS[st] || '#888';
    const inOrder = sameOrder(S.actAs, p.id);
    h += `<div class="mitem"><div class="row"><b class="grow">${esc(p.nation_name)}</b><span class="chip" style="background:${stColor || '#888'};color:#fff">${stName}</span>${inOrder ? '<span class="chip" style="background:#6a1b9a;color:#fff">Rendtag</span>' : ''}</div><div class="row" style="margin-top:6px"><button class="btn ghost" onclick="setDiplo('${p.id}','war')" ${st==='war'||inOrder?'disabled':''}>⚔ Hadi</button><button class="btn ghost" onclick="setDiplo('${p.id}','neutral')" ${st==='neutral'||inOrder?'disabled':''}>Semleges</button><button class="btn ghost" onclick="setDiplo('${p.id}','coop')" ${st==='coop'||inOrder?'disabled':''}>🤝 Együttműk.</button></div></div>`;
  }
  h += `</div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', h);
}
function closeDiplomacy() { $('diplo-modal')?.remove(); }
async function setDiplo(targetId, status) { const { error } = await sb.rpc('set_diplomacy', { p_target: targetId, p_status: status, p_player: S.actAs }); if (error) return alert(error.message); await loadState(); renderGameUpdate(); closeDiplomacy(); openDiplomacy(); }

function openOrders() {
  if (S.demo) return alert('Demóban nem.');
  if (!S.actAs || $('orders-modal')) return;
  const myMembership = (S.orderMembers || []).find(m => m.player_id === S.actAs);
  const myOrder = myMembership ? (S.orders || []).find(o => o.id === myMembership.order_id) : null;
  let h = `<div class="modal-backdrop" id="orders-modal" onclick="if(event.target===this)closeOrders()"><div class="modal"><button class="close" onclick="closeOrders()">✕</button><h2>🏰 Vitézi rend</h2>`;
  if (!myMembership) {
    h += `<p>Még nem vagy tagja rendnek.</p><div class="mitem"><b>Új rend alapítása</b><div class="row" style="margin-top:6px"><input id="order-name" placeholder="Rend neve" maxlength="40" class="grow"><button class="btn" onclick="createOrder()">Alapítás</button></div></div>`;
    const activeOrders = (S.orders || []).filter(o => (S.orderMembers || []).filter(m => m.order_id === o.id && m.status === 'active').length < 3);
    if (activeOrders.length) {
      h += `<h3>Létező rendek</h3>`;
      for (const o of activeOrders) {
        const active = (S.orderMembers || []).filter(m => m.order_id === o.id && m.status === 'active');
        const members = active.map(m => { const p = S.players.find(x => x.id === m.player_id); return p ? esc(p.nation_name) : '?'; }).join(', ');
        const pending = (S.orderMembers || []).find(m => m.order_id === o.id && m.player_id === S.actAs && m.status === 'pending');
        const orderScore = S.scores?.orders?.[o.id]?.total;
        h += `<div class="mitem"><b>${esc(o.name)}</b> <small>(${active.length}/3 tag)</small>${orderScore != null ? ` · <b style="color:var(--gold)">${orderScore} pont</b>` : ''}<br><small>Tagok: ${members}</small>${pending ? `<div class="chip" style="background:#ffe;border:1px solid #cc0">⏳ Jelentkezés függőben</div>` : `<button class="btn ghost" onclick="applyOrder('${o.id}')">Jelentkezés</button>`}</div>`;
      }
    }
  } else {
    const active = (S.orderMembers || []).filter(m => m.order_id === myMembership.order_id && m.status === 'active');
    const pending = (S.orderMembers || []).filter(m => m.order_id === myMembership.order_id && m.status === 'pending');
    const isFounder = myOrder?.founder_id === S.actAs;
    const orderScore = S.scores?.orders?.[myMembership.order_id]?.total;
    h += `<h3>${esc(myOrder?.name || '?')}${orderScore != null ? ` · <b style="color:var(--gold)">${orderScore} pont</b>` : ''}</h3><p>Tagok (${active.length}/3):</p>`;
    for (const m of active) {
      const p = S.players.find(x => x.id === m.player_id);
      const isMe = m.player_id === S.actAs;
      const ps = S.scores?.players?.[m.player_id]?.total || 0;
      h += `<div class="row" style="margin:4px 0;padding:6px;background:#f8f4e8;border-radius:6px"><span class="grow">${esc(p?.nation_name || '?')}${isMe ? ' (te)' : ''}${m.player_id === myOrder?.founder_id ? ' 👑' : ''} <small style="color:var(--gold)">${ps} pont</small></span>${isFounder && !isMe ? `<button class="btn danger" onclick="kickMember('${m.id}')">Kirúgás</button>` : ''}</div>`;
    }
    if (pending.length) {
      h += `<h3>Jelentkezések</h3>`;
      for (const m of pending) {
        const p = S.players.find(x => x.id === m.player_id);
        h += `<div class="row" style="margin:4px 0;padding:6px;background:#fff5e0;border-radius:6px"><span class="grow">${esc(p?.nation_name || '?')}</span>${isFounder ? `<button class="btn" onclick="acceptMember('${m.id}')">Elfogad</button><button class="btn ghost" onclick="declineMember('${m.id}')">Elutasít</button>` : '<span class="chip">várakozik</span>'}</div>`;
      }
    }
    h += `<div class="row" style="margin-top:10px"><button class="btn danger" onclick="leaveOrder('${myMembership.order_id}')">${isFounder ? 'Rend feloszlatása' : 'Kilépés'}</button></div>`;
  }
  h += `</div></div>`;
  document.body.insertAdjacentHTML('beforeend', h);
}
function closeOrders() { $('orders-modal')?.remove(); }
async function createOrder() { const name = $('order-name')?.value?.trim(); if (!name) return alert('Adj nevet.'); const { error } = await sb.rpc('create_order', { p_game: S.sel, p_name: name, p_player: S.actAs }); if (error) return alert(error.message); await loadState(); renderGameUpdate(); closeOrders(); openOrders(); }
async function applyOrder(orderId) { const { error } = await sb.rpc('apply_to_order', { p_order: orderId, p_player: S.actAs }); if (error) return alert(error.message); await loadState(); renderGameUpdate(); closeOrders(); openOrders(); }
async function acceptMember(memberId) { const { error } = await sb.rpc('accept_order_member', { p_member: memberId, p_player: S.actAs }); if (error) return alert(error.message); await loadState(); renderGameUpdate(); closeOrders(); openOrders(); }
async function declineMember(memberId) { const { error } = await sb.rpc('decline_order_member', { p_member: memberId, p_player: S.actAs }); if (error) return alert(error.message); await loadState(); renderGameUpdate(); closeOrders(); openOrders(); }
async function kickMember(memberId) { if (!confirm('Kirúgod?')) return; const { error } = await sb.rpc('kick_order_member', { p_member: memberId, p_player: S.actAs }); if (error) return alert(error.message); await loadState(); renderGameUpdate(); closeOrders(); openOrders(); }
async function leaveOrder(orderId) { if (!confirm('Biztosan?')) return; const { error } = await sb.rpc('leave_order', { p_order: orderId, p_player: S.actAs }); if (error) return alert(error.message); await loadState(); renderGameUpdate(); closeOrders(); openOrders(); }

setInterval(tick, 1000);
</script>
