<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png" type="image/png">
<title>Pályi-játék</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#f3ede0;--ink:#2a2119;--card:#fffdf8;--line:#e0d4bd;--accent:#7a1f1f;--gold:#b8892b;--muted:#7a6c5a;--ok:#2e7d4f;--warn:#b26a00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Arial,sans-serif}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:.2em 0}
  input,select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  input{color:#2a2119;-webkit-text-fill-color:#2a2119;caret-color:#2a2119;background:#fff}
  .mask{-webkit-text-security:disc;text-security:disc}
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  button{cursor:pointer}button:hover:not(:disabled){filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}
  .btn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);font-weight:400}
  .btn.danger{color:#b00020;background:#fff}
  header{background:var(--accent);color:#f6e7c1;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  header .brand{font:700 20px Georgia,serif;margin-right:auto}
  header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
  main{max-width:1180px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#efe6d2;border-radius:999px;padding:2px 10px;font-size:13px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:3px}
  .err{color:#b00020}.okm{color:var(--ok)}
  .badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:#8a8070}
  .badge.running{background:var(--ok)}.badge.paused{background:var(--warn)}.badge.finished{background:#444}
  .auth{display:grid;grid-template-columns:1.1fr 1fr;gap:0;max-width:960px;margin:6vh auto;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .hero{background:linear-gradient(160deg,#5c1414,#8c2a2a);color:#f6e7c1;padding:34px}
  .hero h1{font-size:34px;margin:0 0 6px}.hero p{opacity:.92}
  .hero .offs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:18px;font-size:13px}
  .form{background:var(--card);padding:30px}
  .tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
  .field input{width:100%}.pwrow{display:flex;gap:6px}.pwrow input{flex:1}
  .hint{font-size:12px;min-height:16px;margin-top:2px}
  @media(max-width:760px){.auth{grid-template-columns:1fr;margin:0}.hero{padding:22px}}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .game{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .offgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .office{border:2px solid var(--line);border-left-width:10px;border-radius:10px;padding:10px;background:#fff;cursor:pointer}
  .office.sel{border-color:var(--accent);background:#fbf1e3}.office.off{opacity:.45;cursor:not-allowed}
  #wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#e9e1cf;height:58vh}
  #map{position:relative;width:1400px;height:1000px;transform-origin:0 0}
  .county-svg{position:absolute;cursor:pointer}
  #tooltip{position:absolute;background:#2a2119;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:1000;font-size:13px;line-height:1.45;max-width:320px;pointer-events:none}
  .zoom{position:sticky;float:right;top:8px;right:8px;margin:8px;z-index:20;display:flex;gap:4px}
  .zoom button{padding:4px 10px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;padding:12px;overflow-y:auto}
  .modal{background:var(--card);border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px 20px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 4px;padding-right:30px}
  .modal .close{position:absolute;top:10px;right:10px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
  .modal-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0 14px;flex-wrap:wrap}
  .modal-tabs button{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:0;cursor:pointer}
  .modal-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .mitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}
  .mitem .row{margin:4px 0;flex-wrap:wrap}
  #action-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:52px}
  #action-bar .btn.active{outline:3px solid var(--gold);outline-offset:1px}
  #action-hint{margin-left:8px;color:var(--muted);font-size:13px;min-height:18px;flex-basis:100%}
  .units{pointer-events:none}
  .unit-chip{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid #ccc;border-radius:8px;padding:4px 8px;cursor:pointer;user-select:none}
  .unit-chip.on{background:#e8f5e9;border-color:var(--ok)}
  @media(max-width:600px){.modal-backdrop{align-items:flex-start;padding:8px}.modal{padding:14px;max-height:calc(100vh - 16px)}.modal-tabs button{padding:8px 10px;font-size:14px}#wrap{height:42vh}}
</style>
</head>

const EMAIL_DOMAIN = 'jatek.local';
const sb = window.supabase ? supabase.createClient('https://bcskdpaykdxboimbglud.supabase.co', 'sb_publishable_9Fcjdiw28FeEHzpEP-IDBg_SKix9FXo') : null;
const RES = {gold:'arany',wheat:'búza',corn:'kukorica',wood:'fa',wine:'szőlő/bor',sugar:'cukor',coal:'szén',iron_ore:'vasérc',livestock:'állat'};

Object.values(BICON).forEach(src => { const i = new Image(); i.src = src; });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const slug = u => u.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9._-]/g, '');
const toEmail = u => u.includes('@') ? u.trim() : slug(u.trim()) + '@' + EMAIL_DOMAIN;
const NAME_RE = /^[\p{L}\p{N}_.-]{3,24}$/u;
let S = {user:null, profile:{}, games:[], mySeats:{}, sel:null, players:[], counties:[], byName:{}, btypes:{}, offices:[], defs:[], joinGame:null, pickOffice:null, taken:[], msg:'', ch:null, demo:false, prod:[], prodAt:0, res:{}, mp:null, mpAt:0, actAs:null, picked:null, btAll:[], fin:{}, marketListings:[], marketOffers:[], marketTab:'browse', unitTypes:[], units:[], battles:[], movements:[], diplomacy:[], orders:[], orderMembers:[], actionMode:null, actionPhase:null, selectedUnits:[], actionSource:null, actionSourceName:null, actionTarget:null, hoverTarget:null, pickTimeout:null};
let els = {}, Z = null, authMode = 'login', nameTimer = null; const svgCache = {};

/* === ÚJ: egység-kész állapot ellenőrzés === */
function isUnitReady(u) {
  if (!u) return false;
  if (u.status === 'ready') return true;
  if (u.status === 'training' && u.completes_at && new Date(u.completes_at) <= Date.now()) return true;
  return false;
}

function diploStatus(a, b) {
  if (!a || !b || a === b) return 'self';
  const [x, y] = a < b ? [a, b] : [b, a];
  const rec = (S.diplomacy||[]).find(d => d.player_a === x && d.player_b === y);
  return rec?.status || 'neutral';
}
function ownerDiplo(ownerId) { return !ownerId ? 'unowned' : ownerId === S.actAs ? 'self' : diploStatus(S.actAs, ownerId); }
function sameOrder(a, b) {
  const ma = (S.orderMembers||[]).find(m => m.player_id === a && m.status === 'active');
  const mb = (S.orderMembers||[]).find(m => m.player_id === b && m.status === 'active');
  return ma && mb && ma.order_id === mb.order_id;
}
function imgFallback(img) {
  const span = document.createElement('span');
  span.style.cssText = 'display:inline-block;width:10px;height:10px;background:#888;border:1px solid #222;box-sizing:border-box;';
  img.replaceWith(span);
}
function getSourceUnits() {
  if (!S.actionSource) return [];
  return (S.units||[]).filter(u => u.county_id === S.actionSource && u.player_id === S.actAs && isUnitReady(u));
}

async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { S.user = null; return renderAuth(); }
  S.user = session.user;
  const { data } = await sb.from('profiles').select('username,is_admin').eq('id', S.user.id).single();
  S.profile = data || {};
  const [o, b, d, r, ut] = await Promise.all([
    sb.from('offices').select('*').order('sort'),
    sb.from('building_types').select('*'),
    sb.from('county_definitions').select('id,name,features,start_office'),
    sb.from('county_resources').select('definition_id,resource'),
    sb.from('unit_types').select('*').order('sort').then(x => x.error ? { data:[] } : x)]);
  S.offices = o.data || [];
  S.btypes = Object.fromEntries((b.data || []).map(x => [x.key, x.name]));
  S.btAll = b.data || [];
  S.defs = d.data || [];
  S.unitTypes = ut.data || [];
  S.cres = {}; (r.data || []).forEach(x => (S.cres[x.definition_id] ??= []).push({ resource:x.resource }));
  S.msg = o.error?.message || d.error?.message || r.error?.message || '';
  await loadGames();
  S.sel ? await openGame(S.sel) : renderList();
}
const safeBoot = () => boot().catch(e => { renderAuth(); setMsg('A Supabase nem érhető el (' + e.message + ').', true); });
if (sb) sb.auth.onAuthStateChange(ev => { if (['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev)) safeBoot(); });
else setTimeout(renderAuth, 0);

async function loadGames() {
  const { data } = await sb.from('games').select('*').order('created_at', {ascending:false});
  S.games = data || [];
  const m = await sb.from('game_players').select('game_id,office').eq('profile_id', S.user.id);
  S.mySeats = Object.fromEntries((m.data || []).map(x => [x.game_id, x.office]));
}

function huErr(m) {
  m = String(m || '');
  if (/invalid login/i.test(m)) return 'Hibás felhasználónév vagy jelszó.';
  if (/already registered|already exists/i.test(m)) return 'Ez a felhasználónév már foglalt.';
  if (/at least|weak/i.test(m)) return 'A jelszó legalább 6 karakter legyen.';
  if (/rate limit|too many/i.test(m)) return 'Túl sok próbálkozás.';
  if (/failed to fetch|network/i.test(m)) return 'Nincs kapcsolat.';
  return m;
}
function setMsg(t, bad = true) { const m = $('amsg'); if (m) { m.textContent = t; m.className = 'hint ' + (bad ? 'err' : 'okm'); } }
function renderAuth(force) {
  if (!force && $('un')) return;
  const reg = authMode === 'register', offs = (S.offices.length ? S.offices : [{key:'nagyur',name:'Nagyúr',color:'#c0392b'},{key:'penzugy',name:'Pénzügyminiszter',color:'#27ae60'},{key:'hadugy',name:'Hadügyminiszter',color:'#2c3e50'},{key:'igazsag',name:'Igazságügy',color:'#8e44ad'},{key:'belugy',name:'Belügyminiszter',color:'#e67e22'},{key:'gazdasagi',name:'Gazdasági biztos',color:'#16a085'}]);
  $('app').innerHTML = `<div class="auth"><div class="hero"><h1>Pályi-játék</h1>
    <p><i>Nagy-Magyarország, 1851.</i> A Habsburgok megbuktak, a Pályi-kormány most építi újra az országot.</p>
    <p>72 vármegye, hat tisztség, közös célok és kemény alkuk.</p>
    <div class="offs">${offs.map(o => `<span><span class="dot" style="background:${o.color}"></span> ${esc(o.name)}</span>`).join('')}</div></div>
    <div class="form"><div class="tabs"><button class="${reg ? '' : 'on'}" onclick="setMode('login')">Belépés</button><button class="${reg ? 'on' : ''}" onclick="setMode('register')">Regisztráció</button></div>
    <label class="field"><span>Felhasználónév</span><input id="un" autocomplete="off" maxlength="24" oninput="checkName()"></label><div id="nhint" class="hint"></div>
    <label class="field"><span>Jelszó (min. 6 karakter)</span><div class="pwrow"><input id="pw" type="text" autocomplete="off" >
      <button class="btn ghost eye" type="button" onclick="togglePw()">🙈 Takar</button></div></label>
    ${reg ? `<label class="field"><span>Jelszó újra</span><input id="pw2" type="text" autocomplete="off" ></label>` : ''}
    <button id="go" class="btn" style="width:100%;margin-top:6px" onclick="submitAuth()">${reg ? 'Fiók létrehozása' : 'Belépés'}</button>
    <p id="amsg" class="hint"></p>
    <p style="text-align:center;margin:8px 0 0"><a href="#" onclick="demoStart();return false">Kipróbálom bejelentkezés nélkül (demó)</a></p></div></div>`;
  ['un','pw','pw2'].forEach(id => $(id) && ($(id).onkeydown = e => e.key === 'Enter' && submitAuth()));
}
function setMode(m) { authMode = m; renderAuth(true); }
function togglePw() {
  const on = !$('pw').classList.contains('mask');
  ['pw','pw2','np','np2'].forEach(id => $(id)?.classList.toggle('mask', on));
  document.querySelectorAll('.eye').forEach(x => x.textContent = on ? '👁 Mutat' : '🙈 Takar');
}
function checkName() {
  const h = $('nhint'); if (!h || authMode !== 'register') return;
  clearTimeout(nameTimer); const u = $('un').value.trim();
  if (!u) { h.textContent = ''; return; }
  if (!NAME_RE.test(u)) { h.className = 'hint err'; h.textContent = '3–24 karakter: betűk, számok, _ . -'; return; }
  if (!sb) return;
  nameTimer = setTimeout(async () => {
    const { data, error } = await sb.rpc('username_available', { p_name:u });
    if ($('un')?.value.trim() !== u || error) return;
    h.className = 'hint ' + (data ? 'okm' : 'err'); h.textContent = data ? '✓ szabad' : '✗ foglalt';
  }, 350);
}
async function submitAuth() {
  const reg = authMode === 'register', u = $('un').value.trim(), pw = $('pw').value;
  if (!sb) return setMsg('A Supabase nem érhető el.');
  if (!u || !pw) return setMsg('Add meg a felhasználónevet és a jelszót.');
  if (reg && !NAME_RE.test(u)) return setMsg('A felhasználónév 3–24 karakter.');
  if (pw.length < 6) return setMsg('A jelszó legalább 6 karakter legyen.');
  if (reg && pw !== $('pw2').value) return setMsg('A két jelszó nem egyezik.');
  const btn = $('go'); btn.disabled = true; setMsg(reg ? 'Regisztráció…' : 'Belépés…', false);
  try {
    const email = toEmail(u);
    if (reg) {
      const r = await sb.rpc('register_user', { p_username:u, p_email:email, p_password:pw });
      if (r.error) throw r.error;
      const l = await sb.auth.signInWithPassword({ email, password:pw }); if (l.error) throw l.error;
    } else {
      const r = await sb.auth.signInWithPassword({ email, password:pw }); if (r.error) throw r.error;
    }

  S.players = (p.data || []).map(x => ({ ...x, profiles:null }));
  if (S.profile.is_admin) { if (!S.players.some(x => x.id === S.actAs)) S.actAs = S.players[0]?.id || null; }
  else S.actAs = S.players.find(x => x.profile_id === S.user.id)?.id || null;

    ids.length ? sb.from('buildings').select('county_id,building_type,level,status,completes_at').in('county_id', ids) : { data:[] },
    pids.length ? sb.from('profiles').select('id,username').in('id', pids) : { data:[] },

    S.actAs ? sb.from('player_resources').select('resource,amount').eq('player_id', S.actAs) : { data:[] },

    sb.from('player_units').select('*').eq('game_id', S.sel).then(x => x.error ? { data:[] } : x),
    sb.from('battles').select('*').eq('game_id', S.sel).eq('status','active').then(x => x.error ? { data:[] } : x),
    sb.from('army_movements').select('*').eq('game_id', S.sel).eq('status','marching').then(x => x.error ? { data:[] } : x),
    sb.from('diplomacy').select('*').eq('game_id', S.sel).then(x => x.error ? { data:[] } : x),

  const names = Object.fromEntries((pr.data || []).map(x => [x.id, x.username]));
  S.players = S.players.map(x => ({ ...x, profiles: x.profile_id ? { username:names[x.profile_id] } : null }));
  S.prod = pd.data || []; S.prodAt = Date.now();
  S.res = Object.fromEntries((rs.data || []).map(x => [x.resource, Number(x.amount)]));
  S.mp = mp.data || null; S.mpAt = Date.now();
  S.units = un.data || [];
  S.battles = bt.data || [];
  S.movements = mv.data || [];
  S.diplomacy = dip.data || [];
  S.orders = ord.data || [];

  } else S.orderMembers = [];
  if (S.selectedUnits.length) {

    S.selectedUnits = S.selectedUnits.filter(id => validIds.has(id));

  S.counties = (c.data || []).filter(x => defs[x.definition_id]).map(x => ({ id:x.id, owner_id:x.owner_id,
    county_definitions:{ name:defs[x.definition_id].name, features:defs[x.definition_id].features || [], county_resources:S.cres[x.definition_id] || [] },
    buildings:(b.data || []).filter(y => y.county_id === x.id) }));

const _norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function _bKey(b){ return _norm(b.building_type); }
function _bName(b){ return _norm(S.btypes[b.building_type] || ''); }
function isLaktanya(b){ const k=_bKey(b),n=_bName(b); return ['laktanya','barracks','gyar'].includes(k) || ['laktanya','barracks','gyar'].includes(n); }
function isVarOrVaros(b){ const k=_bKey(b),n=_bName(b); return ['var','varos','castle','city'].includes(k) || ['var','varos','vár','város','castle','city'].includes(n); }
function isComplete(b){ return !b.completes_at || new Date(b.completes_at) <= Date.now(); }
function isSameBType(stored, uiB){ return _bKey(stored)===_norm(uiB.key) || _bName(stored)===_norm(uiB.name); }
function biconFor(b) { return BICON[_norm(b.building_type)] || BICON[_norm(S.btypes[b.building_type])] || null; }

function countyCenter(name) {
  const box = els[name];
  const svg = box?.querySelector('svg');
  const p = POS[name];
  if (!p) return null;
  let w = 26, h = 18;
  if (svg) {
    const vb = svg.getAttribute('viewBox');
    if (vb) {
      const parts = vb.split(/\s+/).map(Number);
      if (parts.length === 4) { w = parts[2]; h = parts[3]; }
    } else {
      w = parseFloat(svg.getAttribute('width')) || w;
      h = parseFloat(svg.getAttribute('height')) || h;
    }
  }
  return { x: parseFloat(p.left) + w / 2, y: parseFloat(p.top) + h / 2 };
}

function renderRoutes() {
  const old = $('route-svg');
  if (old) old.remove();
  const mapEl = $('map'); if (!mapEl) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'route-svg';
  svg.setAttribute('width', 1400); svg.setAttribute('height', 1000);
  svg.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;z-index:5;opacity:0.85;';
  for (const m of (S.movements || [])) {
    const fromC = S.counties.find(c => c.id === m.from_county);
    const toC = S.counties.find(c => c.id === m.to_county);
    if (!fromC || !toC) continue;
    const from = countyCenter(fromC.county_definitions.name);
    const to = countyCenter(toC.county_definitions.name);
    if (!from || !to) continue;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x); line.setAttribute('y2', to.y);
    line.setAttribute('stroke', m.action === 'attack' ? '#d00000' : '#ff9800');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '8,4');
    svg.appendChild(line);
  }
  if (S.actionPhase === 'select-target' && S.hoverTarget && S.actionSource) {
    const srcC = S.counties.find(c => c.id === S.actionSource);
    const tgtC = S.counties.find(c => c.id === S.hoverTarget);
    if (srcC && tgtC) {
      const from = countyCenter(srcC.county_definitions.name);
      const to = countyCenter(tgtC.county_definitions.name);
      if (from && to) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x); line.setAttribute('y2', to.y);
        line.setAttribute('stroke', '#b8892b');
        line.setAttribute('stroke-width', '3');
        line.setAttribute('stroke-dasharray', '12,6');
        svg.appendChild(line);
      }
    }
  }
  mapEl.appendChild(svg);
}

function paint(n) {
  const box = els[n]; if (!box) return;
  const c = S.byName[n]; if (!c) return;
  const p = S.players.find(x => x.id === c.owner_id);
  const svg = box.querySelector('svg');
  if (svg) svg.setAttribute('fill', p ? p.color : '#d3d3d3');

  const diplo = ownerDiplo(c.owner_id);
  const battleHere = (S.battles || []).find(b => b.county_id === c.id && b.status === 'active');
  const isSource = S.actionPhase && S.actionSource === c.id;

  let filter = '';
  if (isSource) {
    filter = 'drop-shadow(0 0 10px gold) drop-shadow(0 0 5px gold)';
  } else if (battleHere) {
    filter = 'drop-shadow(0 0 12px rgba(220,0,0,1)) drop-shadow(0 0 6px rgba(255,0,0,.7))';
  } else if (DIPLO_COLORS[diplo]) {
    filter = `drop-shadow(0 0 6px ${DIPLO_COLORS[diplo]}) drop-shadow(0 0 3px ${DIPLO_COLORS[diplo]})`;
  }
  if (box.style.filter !== filter) box.style.filter = filter;

  let iconBox = box.querySelector('.bicons');
  if (!iconBox) {
    iconBox = document.createElement('div');
    iconBox.className = 'bicons';
    iconBox.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;width:90%;pointer-events:none;z-index:3;';
    box.appendChild(iconBox);
  }
  const icons = [], seen = new Set();
  for (const b of (c.buildings || [])) {
    const src = biconFor(b);
    if (!src || seen.has(src)) continue;
    seen.add(src);
    const inProgress = b.completes_at && new Date(b.completes_at) > Date.now();
    icons.push({ src, inProgress });
  }
  iconBox.innerHTML = icons.map(({ src, inProgress }) =>
    `<img src="${src}" alt="" style="width:14px;height:14px;object-fit:contain;opacity:${inProgress ? '.4' : '1'};filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))">`
  ).join('');

  let unitsBox = box.querySelector('.units');
  if (!unitsBox) {
    unitsBox = document.createElement('div');
    unitsBox.className = 'units';
    unitsBox.style.cssText = 'position:absolute;bottom:1px;left:0;right:0;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-items:center;z-index:4;pointer-events:none;';
    box.appendChild(unitsBox);
  }
  const visible = (S.units || []).filter(u => u.county_id === c.id && (
    u.player_id === S.actAs || diploStatus(S.actAs, u.player_id) === 'ally'));
  const uHtml = visible.map(u => {
    const isSelf = u.player_id === S.actAs;
    const isSelected = S.selectedUnits.includes(u.id);
    const bg = isSelf ? '#555' : '#9c27b0';
    const src = UNIT_ICONS[u.unit_type];
    const icon = src
      ? `<img src="${src}" onerror="imgFallback(this)" style="width:11px;height:11px;object-fit:contain;" alt="">`
      : `<span style="display:inline-block;width:10px;height:10px;background:${bg};border:1px solid #222;box-sizing:border-box;"></span>`;
    const border = isSelected ? '2px solid gold' : '1px solid transparent';
    return `<span class="unit-icon" data-uid="${u.id}" style="display:inline-flex;align-items:center;gap:1px;background:rgba(0,0,0,.65);border-radius:3px;padding:0 2px;border:${border};">
      ${icon}<span style="font-size:9px;font-weight:700;color:#fff;">${u.amount}</span></span>`;
  }).join('');
  unitsBox.innerHTML = uHtml;
}

function paintAll() {
  for (const n of Object.keys(els)) paint(n);
  renderRoutes();
}

function info(n) {
  const c = S.byName[n]; if (!c) return `<b>${esc(n)}</b> (nincs)`;
  const d = c.county_definitions, p = S.players.find(x => x.id === c.owner_id);
  const b = c.buildings.map(x => (S.btypes[x.building_type] || x.building_type) + ' ' + x.level + '. szint' + (x.completes_at && new Date(x.completes_at) > Date.now() ? ' (épül)' : '')).join(', ') || 'nincs';
  const units = (S.units || []).filter(u => u.county_id === c.id);
  const unitStr = units.map(u => {
    const ut = S.unitTypes.find(x => x.key === u.unit_type);
    const ready = isUnitReady(u);
    const hpPct = Math.round((u.hp_ratio || 1) * 100);
    return `${u.amount}× ${ut?.name || u.unit_type}${ready ? ` (${hpPct}%)` : ' (kik.)'}`;
  }).join(', ') || '–';
  const battleHere = (S.battles || []).find(x => x.county_id === c.id && x.status === 'active');
  const battleStr = battleHere ? `<br><b style="color:#b00020">⚔ CSATA FOLYIK</b>` : '';
  const diplo = ownerDiplo(c.owner_id);
  const diploStr = diplo === 'self' ? '' : diplo === 'unowned' ? '<br><small style="color:#888">Uralatlan (1-es helyőrség)</small>' : `<br><small>Viszony: <b style="color:${DIPLO_COLORS[diplo] || '#666'}">${DIPLO_NAMES[diplo] || diplo}</b></small>`;
  return `<b style="font:700 17px Georgia,serif">${esc(n)}</b><br>Tulajdonos: ${p ? esc(p.nation_name) + (p.profiles?.username ? ' (' + esc(p.profiles.username) + ')' : ' (teszt)') : 'senkié'}${diploStr}<br>
    Termel: ${d.county_resources.map(r => RES[r.resource]).join(', ') || '–'}<br>Egyéb: ${esc(d.features.join(', ')) || '–'}<br>Épületek: ${esc(b)}<br>Katonaság: ${esc(unitStr)}${battleStr}`;
}
function tip(n, e) { const t = $('tooltip'); t.innerHTML = info(n); t.style.display = 'block'; moveTip(e); }
function moveTip(e) { const t = $('tooltip'); t.style.left = e.pageX + 12 + 'px'; t.style.top = e.pageY + 12 + 'px'; }

const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + 'ó ' : '') + (h || m ? m + 'p ' : '') + (s % 60) + 'mp'; };
const num = x => (Math.floor(x * 10) / 10).toLocaleString('hu-HU');
const liveAmt = r => Math.min(Number(r.cap_amount), Number(r.current_amount) + Number(r.rate_per_hour) * (Date.now() - S.prodAt) / 3.6e6);
const curMp = () => S.mp ? Math.max(S.mp.manpower, Math.min(S.mp.cap, S.mp.manpower + S.mp.rate * (Date.now() - S.mpAt) / 3.6e6)) : 0;
const costHtml = cost => Object.entries(cost || {}).map(([k, v]) => `${v} ${RES[k] || k}`).join(', ');
const effectHtml = b => [b.production_bonus > 0 && `+${Math.round(b.production_bonus * 100)}% termelés`, b.manpower_bonus > 0 && `+${b.manpower_bonus} munkaerő/óra`,
  b.defense_bonus > 0 && `+${Math.round(b.defense_bonus * 100)}% védelem`].filter(Boolean).join(', ') || '–';

const refreshNow = async () => {
  if (!S.sel) return;
  try { await sb.rpc('tick_military', {p_game:S.sel}); } catch(e){ console.warn('tick_military:', e.message); }
  await loadState();
  if (!els || Object.keys(els).length === 0) { renderGame(); return; }
  renderGameUpdate();
};
async function setActAs(v) { S.actAs = v; await refreshNow(); }

function pick(n) {
  const c = S.byName[n]; if (!c) return;

  if (S.actionPhase === 'select-county') {
    if (c.owner_id !== S.actAs) { updateActionHint('Ez nem a te vármegyéd. Válassz sajátot forrásként.'); return; }
    const units = (S.units||[]).filter(u => u.county_id === c.id && u.player_id === S.actAs && isUnitReady(u));
    if (!units.length) { updateActionHint('Ebben a vármegyében nincs mozgatható egységed.'); return; }
    S.actionSource = c.id;
    S.actionSourceName = n;
    S.actionPhase = 'select-units';
    S.selectedUnits = units.map(u => u.id);
    renderGameUpdate();
    updateActionHint('Válaszd ki az egységeket, majd "Cél kiválasztása".');
    return;
  }

  if (S.actionPhase === 'select-target') {
    if (c.id === S.actionSource) { updateActionHint('A cél nem lehet azonos a forrással.'); return; }
    if (S.actionMode === 'attack') {
      const d = ownerDiplo(c.owner_id);
      if (d === 'coop' || d === 'ally') { alert('Szövetségesre / együttműködőre nem támadhatsz.'); return; }
      if (d === 'self') { alert('Saját vármegyére nem támadhatsz.'); return; }
    }
    S.actionTarget = c.id;
    openSendModal(S.actionSource, c.id, S.actionMode);
    return;
  }

  clearTimeout(S.pickTimeout);
  S.picked = n;
  renderPick();
  S.pickTimeout = setTimeout(() => { S.picked = null; renderPick(); }, 5000);
}

function updateActionHint(t) { const el = $('action-hint'); if (el) el.textContent = t || ''; }

function startAction(mode) {
  if (S.actionMode === mode) { cancelAction(); return; }
  S.actionMode = mode;
  S.actionPhase = 'select-county';
  S.selectedUnits = [];
  S.actionSource = null;
  S.actionSourceName = null;
  S.actionTarget = null;
  S.hoverTarget = null;
  clearTimeout(S.pickTimeout);
  renderGameUpdate();
  const hints = { attack:'⚔ Támadás: kattints egy saját vármegyére.', defend:'🛡 Védekezés: kattints egy saját vármegyére.', move:'→ Mozgatás: kattints egy saját vármegyére.' };
  updateActionHint(hints[mode] || '');
}

function cancelAction() {
  S.actionMode = null; S.actionPhase = null;
  S.selectedUnits = []; S.actionSource = null; S.actionSourceName = null; S.actionTarget = null; S.hoverTarget = null;
  renderGameUpdate();
  updateActionHint('');
}

function backToCounty() {
  S.actionPhase = 'select-county';
  S.actionSource = null;
  S.actionSourceName = null;
  S.actionTarget = null;
  S.selectedUnits = [];
  renderGameUpdate();
  updateActionHint('Kattints egy saját vármegyére.');
}

function backToUnits() {
  S.actionPhase = 'select-units';
  S.actionTarget = null;
  S.hoverTarget = null;
  renderGameUpdate();
  updateActionHint('Válaszd ki az egységeket, majd "Cél kiválasztása".');
}

function advanceToTarget() {
  if (S.selectedUnits.length === 0) return;
  S.actionPhase = 'select-target';
  S.hoverTarget = null;
  renderGameUpdate();
  updateActionHint('Kattints a cél vármegyére (a szaggatott vonal az útvonalat mutatja).');
}

function toggleUnitSelection(unitId) {
  const idx = S.selectedUnits.indexOf(unitId);
  if (idx >= 0) S.selectedUnits.splice(idx, 1);
  else S.selectedUnits.push(unitId);
  const cntEl = $('unit-sel-count');
  if (cntEl) cntEl.textContent = S.selectedUnits.length;
  const goBtn = $('unit-go-btn');
  if (goBtn) goBtn.disabled = S.selectedUnits.length === 0;
  const chip = $('chk-' + unitId)?.closest('.unit-chip');
  if (chip) chip.classList.toggle('on', S.selectedUnits.includes(unitId));
  for (const box of Object.values(els)) {
    const unitsBox = box.querySelector('.units');
    if (!unitsBox) continue;
    for (const el of unitsBox.querySelectorAll('[data-uid]')) {
      const isSel = S.selectedUnits.includes(el.dataset.uid);
      el.style.border = isSel ? '2px solid gold' : '1px solid transparent';
    }
  }
}

function selectAllUnits() {
  const units = getSourceUnits();
  S.selectedUnits = units.map(u => u.id);
  for (const u of units) {
    const chk = $('chk-' + u.id);
    if (chk) { chk.checked = true; chk.closest('.unit-chip')?.classList.add('on'); }
  }
  const cntEl = $('unit-sel-count');
  if (cntEl) cntEl.textContent = S.selectedUnits.length;
  const goBtn = $('unit-go-btn');
  if (goBtn) goBtn.disabled = false;
  for (const box of Object.values(els)) {
    const unitsBox = box.querySelector('.units');
    if (!unitsBox) continue;
    for (const el of unitsBox.querySelectorAll('[data-uid]')) {
      el.style.border = S.selectedUnits.includes(el.dataset.uid) ? '2px solid gold' : '1px solid transparent';
    }
  }
}

function deselectAllUnits() {
  S.selectedUnits = [];
  for (const u of getSourceUnits()) {
    const chk = $('chk-' + u.id);
    if (chk) { chk.checked = false; chk.closest('.unit-chip')?.classList.remove('on'); }
  }
  const cntEl = $('unit-sel-count');
  if (cntEl) cntEl.textContent = 0;
  const goBtn = $('unit-go-btn');
  if (goBtn) goBtn.disabled = true;
  for (const box of Object.values(els)) {
    const unitsBox = box.querySelector('.units');
    if (!unitsBox) continue;
    for (const el of unitsBox.querySelectorAll('[data-uid]')) el.style.border = '1px solid transparent';
  }
}

function sendActionNote(tgtCounty, action) {
  const owner = tgtCounty.owner_id;
  if (!owner) return '🏴 Uralatlan — 1-es helyőrség védi. Azonnali elfoglalás 10% HP veszteséggel.';
  if (owner === S.actAs) return '🏰 Saját terület — békés erősítés.';
  const d = diploStatus(S.actAs, owner);
  if (d === 'coop') return '🤝 Együttműködés — békés áthaladás.';
  if (d === 'ally') return '💜 Társ — békés áthaladás. Látod egységeit.';
  if (d === 'neutral') return '⚠ Semleges — a belépés HÁBORÚT deklarál!';
  if (d === 'war') return '⚔ Hadi állapot — csata lesz.';
  return '';
}

async function openSendModal(srcId, tgtId, action) {
  if ($('send-modal')) return;
  const units = S.selectedUnits.map(id => (S.units||[]).find(u => u.id === id)).filter(Boolean);
  if (!units.length) { alert('Nincs kiválasztott egység.'); cancelAction(); return; }

  const tgtC = S.counties.find(x => x.id === tgtId);
  const srcC = S.counties.find(x => x.id === srcId);
  if (!tgtC || !srcC) { cancelAction(); return; }
  const tgtBattle = (S.battles || []).find(b => b.county_id === tgtId && b.status === 'active');
  if (action === 'attack' && tgtBattle) { alert('Már folyik csata a célban.'); return; }

  const note = sendActionNote(tgtC, action);
  let html = `<div class="modal-backdrop" id="send-modal" onclick="if(event.target===this)closeSendModal()">
    <div class="modal">
      <button class="close" onclick="closeSendModal()">✕</button>
      <h2>${action === 'attack' ? '⚔ Támadás' : action === 'defend' ? '🛡 Védekezés' : '→ Mozgatás'}</h2>
      <p><b>${esc(srcC.county_definitions.name)}</b> → <b>${esc(tgtC.county_definitions.name)}</b></p>
      <p style="padding:8px;background:#f8f4e8;border-radius:6px;font-size:13px">${note}</p>
      <div>`;
  for (const u of units) {
    const ut = S.unitTypes.find(x => x.key === u.unit_type);
    const hpPct = Math.round((u.hp_ratio || 1) * 100);
    html += `<div class="row" style="margin:6px 0;padding:8px;border:1px solid var(--line);border-radius:6px">
      <span class="grow"><b>${esc(ut?.name || u.unit_type)}</b> ×${u.amount} <small>(${hpPct}% HP)</small></span>
      <input type="number" id="send-${u.id}" min="0" max="${u.amount}" value="${u.amount}" style="width:80px">
    </div>`;
  }
  html += `</div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="confirmSend('${action}')">Küldés</button>
        <button class="btn ghost" onclick="closeSendModal()">Mégse</button>
      </div>
      <p id="send-msg" class="hint" style="font-size:12px;color:var(--muted)">A vár +2 védelmet ad a védőnek, és +1 támadást a támadónak (forrásban vár).</p>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function closeSendModal() { $('send-modal')?.remove(); }

async function confirmSend(action) {
  const src = S.actionSource, tgt = S.actionTarget;
  if (!src || !tgt) return closeSendModal();
  const units = S.selectedUnits.map(id => (S.units||[]).find(u => u.id === id)).filter(Boolean);
  const sends = units.map(u => ({ id: u.id, amount: Number($('send-' + u.id)?.value) || 0 })).filter(x => x.amount > 0);
  if (!sends.length) { $('send-msg').textContent = 'Válassz legalább 1 egységet.'; return; }

  let ok = 0, errs = [];
  for (const s of sends) {
    const { error } = await sb.rpc('send_army', { p_unit_id: s.id, p_to_county: tgt, p_amount: s.amount, p_action: action === 'attack' ? 'attack' : 'move', p_player: S.actAs });
    if (error) errs.push(error.message); else ok++;
  }
  closeSendModal();
  if (errs.length) alert('Hibák:\n' + errs.join('\n'));
  if (ok) { cancelAction(); await refreshNow(); }
}

async function splitUnit(unitId) {
  const u = (S.units || []).find(x => x.id === unitId);
  if (!u) return;
  const amt = prompt(`Hány egységet válasszunk le? (1-${u.amount - 1})`, Math.min(5, u.amount - 1));
  if (!amt) return;
  const n = Number(amt);
  if (!n || n < 1 || n >= u.amount) return alert('Érvénytelen mennyiség.');
  const { error } = await sb.rpc('split_units', { p_unit_id: unitId, p_split_amount: n, p_player: S.actAs });
  if (error) return alert(error.message);
  await refreshNow();
}

async function mergeGroup(ids) {
  if (ids.length < 2) return;
  if (!confirm(`${ids.length} köteg egyesítése?`)) return;
  const { error } = await sb.rpc('merge_units', { p_unit_ids: ids, p_player: S.actAs });
  if (error) return alert(error.message);
  await refreshNow();
}

async function retreat(battleId) {
  if (!confirm('Visszavonulsz? Az egységeid fele HP-ja elveszik.')) return;
  const { error } = await sb.rpc('retreat_from_battle', { p_battle_id: battleId, p_player: S.actAs });
  if (error) return alert(error.message);
  await refreshNow();
}

function renderPick() {
  const el = $('pick'); if (!el) return;
  const n = S.picked;
  if (!n) { el.innerHTML = '<span style="color:var(--muted)">Kattints egy vármegyére.</span>'; return; }
  const c = S.byName[n]; let h = info(n);
  if (!c) { el.innerHTML = h; return; }

  const battleHere = (S.battles || []).find(b => b.county_id === c.id && b.status === 'active');
  if (battleHere) {
    const atk = S.players.find(x => x.id === battleHere.attacker_id);
    const def = S.players.find(x => x.id === battleHere.defender_id);
    h += `<hr><div style="padding:10px;background:#fee;border:1px solid #b00020;border-radius:8px">
      <b style="color:#b00020">⚔ Csata folyik!</b><br>
      Támadó: <b>${esc(atk?.nation_name || '?')}</b> · Védő: <b>${esc(def?.nation_name || '?')}</b><br>
      Hátralévő: <b data-end="${battleHere.ends_at}">…</b>
      ${(S.actAs === battleHere.attacker_id || S.actAs === battleHere.defender_id)
        ? `<br><button class="btn danger" style="margin-top:6px" onclick="retreat('${battleHere.id}')">Visszavonulás (fele HP elvész)</button>` : ''}
    </div>`;
  }

  const adm = S.profile.is_admin, mine = c.owner_id && (adm || c.owner_id === S.actAs);
  if (adm) h += `<br>Tulajdonos: <select onchange="assign('${c.id}', this.value)"><option value="">– senkié –</option>` +
    S.players.map(p => `<option value="${p.id}" ${p.id === c.owner_id ? 'selected' : ''}>${esc(p.nation_name)}</option>`).join('') + `</select>`;

  if (!S.demo && mine) {
    const g = S.games.find(x => x.id === S.sel), rows = S.prod.filter(r => r.county_id === c.id);
    h += `<hr><b>Termelés</b>: ` + (rows.map(r => `${RES[r.resource]} <b data-lv="${c.id}|${r.resource}">0</b>/${num(r.cap_amount)} <small>(+${num(r.rate_per_hour)}/ó)</small>`).join(' · ')
      || '<i>csak futó játékban termel</i>') + ` <button class="btn ghost" onclick="rpc('collect_county',{p_county:'${c.id}'})">Begyűjtés</button>`;

    const varOrVarosReady = c.buildings.some(b => isVarOrVaros(b) && isComplete(b));
    const laktanyaAny    = c.buildings.find(isLaktanya);
    const laktanyaReady  = laktanyaAny && isComplete(laktanyaAny);

    h += `<hr><b>Építkezés</b>` + (g.status !== 'running' ? `<div class="err">A játék nem fut.</div>` : '');
    c.buildings.filter(b => !isComplete(b)).forEach(b => {
      h += `<div>${esc(S.btypes[b.building_type] || b.building_type)}: épül, még <b data-end="${b.completes_at}"></b></div>`; });
    h += S.btAll.filter(uiB => !c.buildings.some(st => isSameBType(st, uiB))).map(uiB => {
      let reason = '';
      if (_norm(uiB.key) === 'laktanya' || _norm(uiB.name) === 'laktanya' || _norm(uiB.key) === 'barracks') {
        if (!varOrVarosReady) reason = 'Előbb vár vagy város kell';
      }
      const ok = !reason && (c.owner_id !== S.actAs || (Object.entries(uiB.cost || {}).every(([k, v]) => (S.res[k] || 0) >= v) && curMp() >= uiB.manpower_cost));
      return `<div class="row" style="margin:6px 0"><span class="grow"><b>${esc(uiB.name)}</b> – ${effectHtml(uiB)}<br><small>${reason ? '<span class="err">' + reason + '</span> · ' : ''}Ár: ${costHtml(uiB.cost)}${uiB.manpower_cost ? ', ' + uiB.manpower_cost + ' munkaerő' : ''} · idő: ${fmtT(uiB.build_seconds / (g.speed_multiplier || 1))}</small></span>
        <button class="btn" ${ok && g.status === 'running' ? '' : 'disabled'} onclick="rpc('build_building',{p_county:'${c.id}',p_type:'${uiB.key}'})">Építés</button></div>`; }).join('');

    h += `<hr><b>Katonai toborzás</b>`;
    if (!S.unitTypes.length) {
      h += `<div class="err" style="font-size:13px">Futtattad a 007_units.sql-t?</div>`;
    } else if (!laktanyaAny) {
      h += `<div style="color:var(--muted);font-size:13px">Nincs laktanya.</div>`;
    } else if (!laktanyaReady) {
      const left = (new Date(laktanyaAny.completes_at) - Date.now()) / 1000;
      h += `<div style="font-size:13px">Laktanya épül, még <b>${fmtT(left)}</b>.</div>`;
    } else {
      h += S.unitTypes.map(ut => {
        const cost = ut.cost || {};
        const costStr = Object.entries(cost).map(([k, v]) => `${v} ${RES[k] || k}`).join(', ');
        const canAfford = Object.entries(cost).every(([k, v]) => (S.res[k] || 0) >= v) && curMp() >= ut.manpower_cost;
        const disabled = (!canAfford || g.status !== 'running') ? 'disabled' : '';
        return `<div class="row" style="margin:6px 0"><span class="grow"><b>${esc(ut.name)}</b> – ⚔️ ${ut.attack}× / 🛡️ ${ut.defense}× · ${ut.hp || '?'} HP<br>
          <small>Ár: ${costStr}${ut.manpower_cost ? ', ' + ut.manpower_cost + ' munkaerő' : ''} · idő: ${fmtT(ut.build_seconds / (g.speed_multiplier || 1))}</small></span>
          <input type="number" id="rec-${ut.key}" min="1" value="1" style="width:70px" ${disabled}>
          <button class="btn" ${disabled} onclick="recruit('${c.id}','${ut.key}')">Toborzás</button>
        </div>`;
      }).join('');
    }

    const countyUnits = (S.units || []).filter(u => u.county_id === c.id);
    if (countyUnits.length) {
      h += `<hr><b>Katonaság</b>`;
      const myReady = countyUnits.filter(u => u.player_id === S.actAs && isUnitReady(u));
      const groups = {};
      for (const u of myReady) (groups[u.unit_type] = groups[u.unit_type] || []).push(u);
      for (const [type, list] of Object.entries(groups)) {
        if (list.length < 2) continue;
        const ut = S.unitTypes.find(x => x.key === type);
        h += `<div class="row" style="margin:4px 0;padding:6px;background:#f0e6d0;border-radius:6px">
          <span class="grow"><b>${esc(ut?.name || type)}</b>: ${list.length} köteg</span>
          <button class="btn ghost" onclick="mergeGroup(${JSON.stringify(list.map(x => x.id)).replace(/"/g, "'")})">Összes egyesítése</button>
        </div>`;
      }
      for (const u of countyUnits) {
        const ut = S.unitTypes.find(x => x.key === u.unit_type);
        const hpPct = Math.round((u.hp_ratio || 1) * 100);
        const training = !isUnitReady(u);
        const myUnit = u.player_id === S.actAs;
        h += `<div class="row" style="margin:4px 0">
          <span class="grow">${u.amount}× <b>${esc(ut?.name || u.unit_type)}</b> <small>(${hpPct}% HP${training ? ' · kiképzés' : ''})</small></span>
          ${myUnit && !training && u.amount > 1 ? `<button class="btn ghost" onclick="splitUnit('${u.id}')">Hasítás</button>` : ''}
        </div>`;
      }
    }

    const inTransit = (S.movements || []).filter(m => m.player_id === S.actAs);
    if (inTransit.length) {
      h += `<hr><b>Mozgásban</b>`;
      for (const m of inTransit) {
        const toC = S.counties.find(x => x.id === m.to_county);
        const ut = S.unitTypes.find(x => x.key === m.unit_type);
        h += `<div style="font-size:13px;color:var(--muted)">${m.amount}× ${esc(ut?.name || m.unit_type)} → ${esc(toC?.county_definitions.name || '?')} (<span data-end="${m.arrive_at}">…</span>)${m.action === 'attack' ? ' <b style="color:#b00020">[támadás]</b>' : ''}</div>`;
      }
    }

    const built = S.btAll.filter(uiB => c.buildings.some(st => isSameBType(st, uiB))).map(b => esc(b.name)).join(', ');
    if (built) h += `<div style="color:var(--muted);font-size:12px;margin-top:8px">Már megépült: ${built}.</div>`;
  }
  el.innerHTML = h; tick();
}

async function recruit(countyId, unitKey) {
  if (S.demo) return alert('Demóban nem.');
  const amt = Number($('rec-' + unitKey)?.value);
  if (!amt || amt < 1) return alert('Legalább 1.');
  const ut = S.unitTypes.find(x => x.key === unitKey);
  if (!confirm(`Toborzás: ${amt}× ${ut?.name || unitKey}?`)) return;
  const { error } = await sb.rpc('recruit_unit', { p_county: countyId, p_type: unitKey, p_amount: amt, p_player: S.actAs });
  if (error) return alert(error.message);
  await refreshNow();
}

function tick() {
  document.querySelectorAll('[data-lv]').forEach(e => { const [cid, res] = e.dataset.lv.split('|');
    const r = S.prod.find(x => x.county_id === cid && x.resource === res); if (r) e.textContent = num(liveAmt(r)); });
  const mp = $('mpv'); if (mp) mp.textContent = Math.floor(curMp());
  const pd = $('pend'); if (pd) pd.textContent = Math.floor(S.prod.filter(r => r.owner_id === S.actAs).reduce((a, r) => a + liveAmt(r), 0));
  document.querySelectorAll('[data-end]').forEach(e => { const s = (Date.parse(e.dataset.end) - Date.now()) / 1000; e.textContent = fmtT(s);
    if (s <= 0 && !S.fin[e.dataset.end]) { S.fin[e.dataset.end] = 1; setTimeout(refreshNow, 800); } });
  document.querySelectorAll('[data-unit-end]').forEach(e => {
    const u = (S.units || []).find(x => x.id === e.dataset.unitEnd);
    if (!u || !u.completes_at) { e.textContent = '–'; return; }
    const s = (Date.parse(u.completes_at) - Date.now()) / 1000;
    e.textContent = fmtT(s);
    if (s <= 0 && !S.fin['u_' + u.id]) { S.fin['u_' + u.id] = 1; setTimeout(refreshNow, 800); }
  });
}

async function loadMarket() {
  if (S.demo || !S.actAs || !S.sel) return;
  const [l, o] = await Promise.all([
    sb.from('market_listings').select('*').eq('game_id', S.sel).order('created_at', { ascending:false }),

async function loadMarketAndRender() { await loadMarket(); renderMarket(); }
async function marketTab(t) { S.marketTab = t; await loadMarketAndRender(); }
const resName = r => RES[r] || r;
const listingTitle = l => l.kind === 'sell' ? `Kínál: ${l.amount}× ${resName(l.resource)}` : `Keres: ${l.amount}× ${resName(l.resource)}`;
function playerName(pid) { const p = S.players.find(x => x.id === pid); return p ? esc(p.nation_name) : '(?)'; }

function renderMarketBrowse(me) {

      }
    }
    h += `<div class="row" style="margin-top:10px"><button class="btn danger" onclick="leaveOrder('${myMembership.order_id}')">${isFounder ? 'Rend feloszlatása' : 'Kilépés'}</button></div>`;
  }
  h += `</div></div>`;
  document.body.insertAdjacentHTML('beforeend', h);
}
function closeOrders() { $('orders-modal')?.remove(); }
async function createOrder() {
  const name = $('order-name')?.value?.trim();
  if (!name) return alert('Adj nevet.');
  const { error } = await sb.rpc('create_order', { p_game: S.sel, p_name: name, p_player: S.actAs });
  if (error) return alert(error.message);
  await loadState(); renderGameUpdate(); closeOrders(); openOrders();
}
async function applyOrder(orderId) {
  const { error } = await sb.rpc('apply_to_order', { p_order: orderId, p_player: S.actAs });
  if (error) return alert(error.message);

}

  if (!confirm('Kirúgod?')) return;
